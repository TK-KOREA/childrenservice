<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사랑의 발씻김 퀴즈 대모험</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦶</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --water: #3FA7E0; --water-deep: #1E6FA8; --water-light: #E0F2FF;
  --sun: #FFB703; --sun-deep: #B47A00; --sun-light: #FFF3D1;
  --heart: #FF6B81; --heart-deep: #C94B60;
  --leaf: #4CBB5F; --leaf-deep: #2E8B44;
  --miss: #FF5A5A; --miss-deep: #C13B3B;
  --ink: #3A342C; --muted: #7A7466;
}

body {
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #D6EFFF 0%, #EAF7FF 45%, #FFF6E0 100%);
  color: var(--ink);
  position: relative;
  overflow-x: hidden;
  padding: 22px 14px 56px;
  -webkit-tap-highlight-color: transparent;
}

.bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bubble {
  position: absolute; bottom: -40px; border-radius: 50%;
  background: rgba(120,190,235,.16); border: 2px solid rgba(120,190,235,.3);
  animation: rise linear infinite;
}
@keyframes rise {
  from { transform: translateY(0); opacity: 0; }
  12% { opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}

.wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; text-align: center; }

.sound-btn {
  position: fixed; top: 14px; right: 14px; z-index: 20;
  width: 46px; height: 46px; border-radius: 50%;
  background: #fff; border: 2.5px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink); font-size: 20px; cursor: pointer;
  transition: transform .1s, box-shadow .1s;
}
.sound-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

.card {
  background: #fff; border: 3px solid var(--ink); border-radius: 26px;
  padding: 26px 22px; position: relative; text-align: center;
}
.pop { animation: popIn .35s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes popIn {
  from { transform: scale(.92) translateY(12px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.eyebrow { font-size: .92rem; letter-spacing: .08em; color: var(--water-deep); margin-bottom: 6px; }
.title { font-size: 2.1rem; line-height: 1.22; margin: 4px 0 10px; }
.sub { font-size: 1.05rem; line-height: 1.55; color: #5C564C; margin-bottom: 16px; }

.hero-emoji { font-size: 46px; display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
.bob { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
.d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

.stage-preview { display: flex; gap: 8px; margin: 16px 0; }
.preview-chip {
  flex: 1; border: 2.5px solid; border-radius: 16px; padding: 10px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .85rem; line-height: 1.25;
}
.preview-emoji { font-size: 24px; }
.preview-count { font-size: .75rem; color: var(--muted); }

.howto {
  list-style: none; text-align: left; background: #FBF7EE;
  border: 2.5px dashed #C9BFA8; border-radius: 16px;
  padding: 12px 16px; margin: 0 0 18px;
  display: flex; flex-direction: column; gap: 7px; font-size: .98rem;
}

.big-btn {
  display: inline-block; width: 100%;
  font-family: inherit; font-size: 1.28rem; color: #fff;
  background: var(--water);
  border: 3px solid var(--ink); border-radius: 18px;
  padding: 14px 20px; cursor: pointer;
  box-shadow: 0 6px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.big-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

.total-tag { margin-top: 12px; font-size: .85rem; color: var(--muted); }

.stage-big { font-size: 64px; animation: bob 2s ease-in-out infinite; }
.stage-title { font-size: 1.8rem; margin: 4px 0 10px; }
.pill {
  display: inline-block; padding: 6px 16px; border-radius: 999px;
  border: 2.5px solid var(--ink); font-size: .95rem; margin-bottom: 18px;
}

.hud { max-width: 560px; margin: 0 auto 16px; position: relative; z-index: 1; }
.hud-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stage-chip {
  color: #fff; font-size: .92rem; padding: 5px 12px; border-radius: 999px;
  border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.score-chip {
  margin-left: auto; background: #fff; padding: 5px 12px; border-radius: 999px;
  border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: .92rem;
}
.streak-chip {
  background: var(--sun-light); border: 2px solid var(--sun-deep); color: #8A5800;
  padding: 5px 10px; border-radius: 999px; font-size: .88rem;
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

.track-wrap { position: relative; }
.track {
  height: 22px; background: #fff; border: 2.5px solid var(--ink);
  border-radius: 999px; overflow: hidden;
  box-shadow: inset 0 2px 0 rgba(0,0,0,.06);
}
.fill {
  height: 100%; background: linear-gradient(90deg, #8FD5FF, var(--water));
  border-radius: 999px; transition: width .5s ease;
}
.foot {
  position: absolute; top: -17px; font-size: 24px;
  transition: left .5s ease; animation: bob 1.6s ease-in-out infinite;
}
.counter { text-align: right; font-size: .84rem; margin-top: 7px; color: var(--muted); }

.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.q-num {
  color: #fff; padding: 4px 13px; border-radius: 12px;
  border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 1rem;
}
.not-badge {
  background: #FFF1C9; border: 2px solid var(--sun-deep); color: #7A5200;
  padding: 4px 10px; border-radius: 999px; font-size: .84rem;
  animation: pulse 1.4s ease-in-out infinite;
}
.ref-tag {
  background: var(--water-light); border: 2px solid var(--water); color: var(--water-deep);
  padding: 4px 10px; border-radius: 999px; font-size: .8rem; margin-left: auto;
}
.q-text { font-size: 1.3rem; line-height: 1.45; margin: 14px 0 18px; text-align: left; }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  font-family: inherit; font-size: 1.04rem; color: var(--ink);
  background: #fff; border: 2.5px solid var(--ink); border-radius: 16px;
  padding: 11px 13px; cursor: pointer;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .1s, box-shadow .1s, background .15s;
}
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.right {
  background: #E4F8E7; border-color: var(--leaf-deep);
  box-shadow: 0 4px 0 var(--leaf-deep); animation: popBounce .45s;
}
.opt.miss {
  background: #FFE9E9; border-color: var(--miss-deep);
  box-shadow: 0 4px 0 var(--miss-deep); animation: shake .4s;
}
.opt.dim { opacity: .45; box-shadow: 0 3px 0 rgba(58,52,44,.4); }
@keyframes popBounce { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
}
.opt-letter {
  flex: 0 0 34px; height: 34px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.02rem; background: #EFEAE0; border: 2px solid var(--ink);
}
.opt.right .opt-letter { background: var(--leaf); color: #fff; border-color: var(--leaf-deep); }
.opt.miss .opt-letter { background: var(--miss); color: #fff; border-color: var(--miss-deep); }
.opt-text { flex: 1; line-height: 1.38; }
.opt-mark { font-size: 1.05rem; }

.after { margin-top: 18px; }
.verdict { font-size: 1.25rem; margin-bottom: 10px; }
.verdict.good { color: var(--leaf-deep); }
.verdict.bad { color: var(--miss-deep); }
.explain {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  background: #FFF8E4; border: 2.5px dashed var(--sun-deep); border-radius: 16px;
  padding: 12px 14px; margin-bottom: 16px; line-height: 1.5; font-size: 1rem;
}
.bulb { font-size: 1.25rem; }

.confetti { position: absolute; left: 50%; top: 32%; pointer-events: none; z-index: 5; }
.confetti span { position: absolute; font-size: 20px; animation: burst .9s ease-out forwards; }
@keyframes burst {
  0% { transform: translate(0, 0) scale(.4) rotate(0deg); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(var(--ss)) rotate(var(--rr)); opacity: 0; }
}

.stars { margin: 12px 0 14px; }
.star { font-size: 46px; color: #E7DFCE; display: inline-block; margin: 0 5px; }
.star.on {
  color: var(--sun); text-shadow: 0 3px 0 rgba(58,52,44,.22);
  animation: starPop .5s cubic-bezier(.34, 1.56, .64, 1) both;
}
@keyframes starPop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }

.badge-emoji { font-size: 66px; animation: bob 2s ease-in-out infinite; }
.badge-title { font-size: 1.9rem; margin: 4px 0 8px; }
.big-score { font-size: 1.7rem; margin: 6px 0 12px; }
.big-score span { font-size: 1.05rem; color: var(--muted); }
.final-track {
  height: 18px; background: #F0EBDF; border: 2.5px solid var(--ink);
  border-radius: 999px; overflow: hidden; margin: 0 auto 14px; max-width: 320px;
}
.final-track div { height: 100%; background: linear-gradient(90deg, var(--heart), #FF9AAB); transition: width .8s ease; }
.mini { font-size: .95rem; color: var(--muted); margin: 4px 0 8px; }

.stage-rows { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
.stage-row {
  display: flex; align-items: center; gap: 10px;
  background: #FBF7EE; border: 2px solid #E0D9C8; border-radius: 14px;
  padding: 9px 13px; font-size: .96rem; text-align: left;
}
.stage-row .rn { color: var(--muted); font-size: .88rem; }
.stage-row .rs { margin-left: auto; color: var(--sun); letter-spacing: 2px; white-space: nowrap; }

.review {
  text-align: left; background: #FBF7EE; border: 2.5px solid var(--ink);
  border-radius: 18px; padding: 14px; margin: 16px 0;
}
.review h3 { font-size: 1.05rem; margin-bottom: 10px; }
.review-item {
  background: #fff; border: 2px solid #E0D9C8; border-radius: 14px;
  padding: 10px 12px; margin-bottom: 10px; font-size: .92rem; line-height: 1.48;
}
.review-item:last-child { margin-bottom: 0; }
.rq { margin-bottom: 6px; }
.rq-no {
  display: inline-block; background: var(--ink); color: #fff;
  border-radius: 8px; padding: 1px 8px; margin-right: 6px; font-size: .8rem;
}
.ra { margin: 2px 0; }
.ra.bad { color: var(--miss-deep); }
.ra.good { color: var(--leaf-deep); }
.rx { color: var(--muted); margin-top: 5px; }

.perfect {
  background: #E4F8E7; border: 2.5px solid var(--leaf-deep); color: var(--leaf-deep);
  border-radius: 16px; padding: 12px; margin: 16px 0; font-size: 1.05rem;
}
.verse { margin: 18px 0 16px; font-size: 1.18rem; color: var(--heart-deep); }
.verse span { display: block; font-size: .85rem; color: var(--muted); margin-top: 5px; }

.opt:focus-visible, .big-btn:focus-visible, .sound-btn:focus-visible {
  outline: 3px solid var(--water-deep); outline-offset: 3px;
}

@media (max-width: 420px) {
  .title { font-size: 1.72rem; }
  .q-text { font-size: 1.17rem; }
  .card { padding: 20px 15px; }
  .preview-chip { font-size: .78rem; padding: 8px 4px; }
  .opt { font-size: .98rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}
</style>
</head>
<body>

<div class="bubbles" aria-hidden="true">

  <span class="bubble" style="left:47%; width:20px; height:20px; animation-duration:16s; animation-delay:9s"></span>
  <span class="bubble" style="left:70%; width:12px; height:12px; animation-duration:20s; animation-delay:2s"></span>
  <span class="bubble" style="left:88%; width:24px; height:24px; animation-duration:15s; animation-delay:7s"></span>

<button class="sound-btn" id="soundBtn" onclick="toggleSound()" aria-label="소리 끄기">🔊</button>

<div class="wrap" id="app"></div>

const TOTAL = STAGES.reduce((s, st) => s + st.questions.length, 0);
const CORRECT_MSGS = ["정답이에요! 🎉", "와, 대단해요! ✨", "참 잘했어요! 💯", "멋져요! 🌟", "할렐루야, 정답! 🙌"];
const WRONG_MSGS = ["아쉬워요! 정답을 확인해 봐요 🔍", "괜찮아요, 지금 배우면 돼요 🌈", "다음 문제는 맞힐 수 있어요 💪"];

// ─────────────── 상태 ───────────────
let state;
function freshState(soundOn) {
  return {
    screen: "start", stageIdx: 0, qIdx: 0, picked: null,
    score: 0, stageScores: [0, 0, 0],
    streak: 0, bestStreak: 0,
    wrongList: [], feedback: "",
    soundOn: soundOn === undefined ? true : soundOn
  };
}
state = freshState();

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function doneBefore() { return STAGES.slice(0, state.stageIdx).reduce((s, st) => s + st.questions.length, 0); }
function globalNo() { return doneBefore() + state.qIdx + 1; }

// ─────────────── 효과음 (Web Audio) ───────────────
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  return audioCtx;
}
function beep(freq, at, dur, type, vol) {
  if (!state.soundOn) return;
  at = at || 0; dur = dur || 0.15; type = type || "triangle"; vol = vol || 0.16;
  try {
    const ctx = getCtx();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + at;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function playClick()   { beep(660, 0, 0.07, "square", 0.06); }
function playCorrect() { beep(523.25, 0, 0.12); beep(659.25, 0.09, 0.12); beep(783.99, 0.18, 0.22); }
function playWrong()   { beep(233, 0, 0.18, "sine", 0.12); beep(185, 0.14, 0.26, "sine", 0.1); }
function playFanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, i * 0.1, 0.16)); beep(1046.5, 0.44, 0.3); }

function toggleSound() {
  state.soundOn = !state.soundOn;
  const b = document.getElementById("soundBtn");
  b.textContent = state.soundOn ? "🔊" : "🔇";
  b.setAttribute("aria-label", state.soundOn ? "소리 끄기" : "소리 켜기");
  if (state.soundOn) playClick();
}

// ─────────────── 진행 로직 ───────────────
function startQuiz()  { playClick(); state.screen = "intro"; render(true); }
function startStage() { playClick(); state.screen = "quiz";  render(true); }

function pickAnswer(i) {
  if (state.picked !== null) return;
  const stage = STAGES[state.stageIdx];
  const q = stage.questions[state.qIdx];
  state.picked = i;
  if (i === q.a) {
    state.score++;
    state.stageScores[state.stageIdx]++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.feedback = rand(CORRECT_MSGS);
    playCorrect();
  } else {
    state.streak = 0;
    state.wrongList.push({ no: globalNo(), q: q, pickedIdx: i });
    state.feedback = rand(WRONG_MSGS);
    playWrong();
  }
  render(false);
  const after = document.querySelector(".after");
  if (after) after.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextQ() {
  playClick();
  const stage = STAGES[state.stageIdx];
  state.picked = null;
  state.feedback = "";
  if (state.qIdx + 1 < stage.questions.length) {
    state.qIdx++;
  } else {
    playFanfare();
    state.screen = "stageDone";
  }
  render(true);
}

function nextStage() {
  playClick();
  if (state.stageIdx + 1 < STAGES.length) {
    state.stageIdx++;
    state.qIdx = 0;
    state.screen = "intro";
  } else {
    playFanfare();
    state.screen = "final";
  }
  render(true);
}

function restart() {
  playClick();
  state = freshState(state.soundOn);
  render(true);
}

// ─────────────── 화면 그리기 ───────────────
function confettiHTML() {
  const pieces = ["💛", "💙", "❤️", "⭐", "✨", "💧", "🌟", "💚"];
  let s = '<div class="confetti" aria-hidden="true">';
  for (let i = 0; i < 22; i++) {
    const angle = (i / 22) * Math.PI * 2;
    const dist = 90 + (i % 5) * 34;
    const tx = Math.round(Math.cos(angle) * dist);
    const ty = Math.round(Math.sin(angle) * dist) - 44;
    const d = (i % 4) * 0.05;
    const r = (i % 2 ? 1 : -1) * (120 + i * 12);
    const sc = (0.8 + (i % 3) * 0.3).toFixed(1);
    s += '<span style="--tx:' + tx + 'px;--ty:' + ty + 'px;--rr:' + r + 'deg;--ss:' + sc +
         ';animation-delay:' + d + 's">' + pieces[i % 8] + '</span>';
  }
  return s + '</div>';
}

function viewHud() {
  const st = STAGES[state.stageIdx];
  const answered = doneBefore() + state.qIdx + (state.picked !== null ? 1 : 0);
  const pct = Math.round((answered / TOTAL) * 100);
  const streakChip = state.streak >= 3
    ? '<span class="streak-chip">🔥 ' + state.streak + '연속 정답!</span>' : '';
  return '<div class="hud"><div class="hud-top">' +
    '<span class="stage-chip" style="background:' + st.color + '">' + st.emoji + ' ' + st.short + '</span>' +
    streakChip +
    '<span class="score-chip">❤️ ' + state.score + '</span></div>' +
    '<div class="track-wrap"><div class="track">' +
      '<div class="fill" style="width:' + pct + '%"></div></div>' +
      '<span class="foot" aria-hidden="true" style="left:calc(' + pct + '% - 14px)">🦶</span></div>' +
    '<p class="counter">' + globalNo() + ' / ' + TOTAL + ' 걸음</p></div>';
}

function viewQuiz() {
  const st = STAGES[state.stageIdx];
  const q = st.questions[state.qIdx];
  const answered = state.picked !== null;
  const correct = answered && state.picked === q.a;
  const isLastOfStage = state.qIdx + 1 >= st.questions.length;
  const isLastStage = state.stageIdx + 1 >= STAGES.length;

  let optsHtml = "";
  for (let i = 0; i < q.opts.length; i++) {
    let cls = "opt";
    if (answered) {
      if (i === q.a) cls += " right";
      else if (i === state.picked) cls += " miss";
      else cls += " dim";
    }
    const letterStyle = !answered
      ? ' style="background:' + st.light + ';border-color:' + st.dark + ';color:' + st.dark + '"' : '';
    let mark = "";
    if (answered && i === q.a) mark = '<span class="opt-mark" aria-hidden="true">⭕</span>';
    else if (answered && i === state.picked) mark = '<span class="opt-mark" aria-hidden="true">❌</span>';
    optsHtml += '<button class="' + cls + '"' + (answered ? ' disabled' : '') +
      ' onclick="pickAnswer(' + i + ')">' +
      '<span class="opt-letter"' + letterStyle + '>' + "ABCD"[i] + '</span>' +
      '<span class="opt-text">' + q.opts[i] + '</span>' + mark + '</button>';
  }

  let afterHtml = "";
  if (answered) {
    const nextLabel = !isLastOfStage ? "다음 문제 👉" : (isLastStage ? "결과 보기 🏆" : "단계 완료! 🎉");
    afterHtml = '<div class="after pop">' +
      '<p class="verdict ' + (correct ? "good" : "bad") + '" role="status">' + state.feedback + '</p>' +
      '<div class="explain"><span class="bulb" aria-hidden="true">💡</span><p>' + q.exp + '</p></div>' +
      '<button class="big-btn" style="background:' + st.color + '" onclick="nextQ()">' + nextLabel + '</button></div>';
  }

  return viewHud() +
    '<div class="card pop" style="box-shadow:0 8px 0 ' + st.dark + '">' +
    (correct ? confettiHTML() : '') +
    '<div class="q-head">' +
      '<span class="q-num" style="background:' + st.color + '">Q' + globalNo() + '</span>' +
      (q.not ? '<span class="not-badge">⚠️ 아닌 것을 골라요!</span>' : '') +
      (q.ref ? '<span class="ref-tag">📖 ' + q.ref + '</span>' : '') + '</div>' +
    '<h2 class="q-text">' + q.q + '</h2>' +
    '<div class="opts">' + optsHtml + '</div>' + afterHtml + '</div>';
}

function viewStageDone() {
  const st = STAGES[state.stageIdx];
  const sScore = state.stageScores[state.stageIdx];
  const sTotal = st.questions.length;
  const ratio = sScore / sTotal;
  const stars = ratio === 1 ? 3 : ratio >= 0.7 ? 2 : 1;
  const msg = stars === 3 ? "완벽해요! 반짝반짝 빛나요 ✨"
    : stars === 2 ? "정말 잘했어요! 조금만 더 가면 만점! 💪"
    : "끝까지 도전한 것이 제일 멋져요! 🌈";
  const isLastStage = state.stageIdx + 1 >= STAGES.length;
  const btnColor = isLastStage ? "#FF6B81" : STAGES[state.stageIdx + 1].color;
  const btnLabel = isLastStage ? "최종 결과 보기 🏆" : "STAGE " + (state.stageIdx + 2) + "로 출발! 🚀";

  let starsHtml = "";
  for (let i = 0; i < 3; i++) {
    starsHtml += '<span class="star' + (i < stars ? " on" : "") +
      '" style="animation-delay:' + (i * 0.18) + 's">★</span>';
  }
  return '<div class="card pop" style="box-shadow:0 8px 0 ' + st.dark + '">' +
    '<p class="eyebrow" style="color:' + st.dark + '">STAGE ' + (state.stageIdx + 1) + ' 완료!</p>' +
    '<div class="stars" aria-label="' + stars + '개의 별">' + starsHtml + '</div>' +
    '<h2 class="stage-title">' + st.name + ' 통과! ' + st.emoji + '</h2>' +
    '<p class="sub">' + sTotal + '문제 중 <strong>' + sScore + '문제</strong> 정답!</p>' +
    '<p class="sub">' + msg + '</p>' +
    '<button class="big-btn" style="background:' + btnColor + '" onclick="nextStage()">' + btnLabel + '</button></div>';
}

function viewFinal() {
  const pct = Math.round((state.score / TOTAL) * 100);
  const badge = pct === 100 ? { e: "👑", t: "사랑 실천왕", m: "모든 문제를 다 맞혔어요! 배운 사랑을 꼭 실천해 보아요!" }
    : pct >= 90 ? { e: "🏆", t: "사랑 챔피언", m: "거의 다 맞혔어요! 예수님의 사랑을 잘 배웠네요!" }
    : pct >= 70 ? { e: "⭐", t: "사랑 탐험가", m: "훌륭해요! 아래 문제만 다시 보면 완벽해요!" }
    : pct >= 50 ? { e: "🌱", t: "사랑 새싹", m: "사랑의 새싹이 자라고 있어요! 한 번 더 도전해 볼까요?" }
    : { e: "💪", t: "용감한 도전자", m: "끝까지 해낸 것이 대단해요! 다시 도전하면 더 잘할 수 있어요!" };

  const rows = STAGES.map(function (st, i) {
    const r = state.stageScores[i] / st.questions.length;
    const s = r === 1 ? 3 : r >= 0.7 ? 2 : 1;
    return '<div class="stage-row"><span aria-hidden="true">' + st.emoji + '</span>' +
      '<span>' + st.name + '</span>' +
      '<span class="rn">' + state.stageScores[i] + '/' + st.questions.length + '</span>' +
      '<span class="rs">' + "★".repeat(s) + "☆".repeat(3 - s) + '</span></div>';
  }).join("");

  let reviewHtml;
  if (state.wrongList.length > 0) {
    const items = state.wrongList.map(function (w) {
      return '<div class="review-item">' +
        '<p class="rq"><span class="rq-no">Q' + w.no + '</span>' + w.q.q + '</p>' +
        '<p class="ra bad">내가 고른 답 · ' + "ABCD"[w.pickedIdx] + '. ' + w.q.opts[w.pickedIdx] + '</p>' +
        '<p class="ra good">정답 · ' + "ABCD"[w.q.a] + '. ' + w.q.opts[w.q.a] + '</p>' +
        '<p class="rx">💡 ' + w.q.exp + '</p></div>';
    }).join("");
    reviewHtml = '<div class="review"><h3>💡 다시 보면 좋은 문제 (' + state.wrongList.length + '개)</h3>' + items + '</div>';
  } else {
    reviewHtml = '<div class="perfect">🎊 틀린 문제가 하나도 없어요! 완벽해요!</div>';
  }

  const streakHtml = state.bestStreak >= 3
    ? '<p class="mini">🔥 최고 연속 정답: ' + state.bestStreak + '개</p>' : '';

  return '<div class="card pop" style="box-shadow:0 8px 0 #C94B60">' +
    '<div class="badge-emoji" aria-hidden="true">' + badge.e + '</div>' +
    '<p class="eyebrow" style="color:#C94B60">최종 결과</p>' +
    '<h2 class="badge-title">' + badge.t + '</h2>' +
    '<p class="big-score">❤️ ' + state.score + ' <span>/ ' + TOTAL + '</span></p>' +
    '<div class="final-track"><div style="width:' + pct + '%"></div></div>' +
    '<p class="sub">' + badge.m + '</p>' + streakHtml +
    '<div class="stage-rows">' + rows + '</div>' + reviewHtml +
    '<div class="verse">『서로 사랑하십시오』<span>— 요한복음 13:34</span></div>' +
    '<button class="big-btn" style="background:#FF6B81" onclick="restart()">다시 도전하기 🔁</button></div>';
}

function render(scrollTop) {
  const app = document.getElementById("app");
  let html = "";
  if (state.screen === "start") html = viewStart();
  else if (state.screen === "intro") html = viewIntro();
  else if (state.screen === "quiz") html = viewQuiz();
  else if (state.screen === "stageDone") html = viewStageDone();
  else if (state.screen === "final") html = viewFinal();
  app.innerHTML = html;
  if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
}

render(false);
</script>
</body>
</html>
