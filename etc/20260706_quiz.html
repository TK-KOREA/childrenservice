<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 경기권역 어린이특별집회 · 초고4 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{
  --gold:#FF9F1C; --gold-deep:#F27D0C;
  --teal:#2EC4B6; --teal-deep:#199a8e;
  --mint:#06D6A0; --coral:#FF7A8A; --coral-deep:#f2536a;
  --ink:#22333B; --ink-soft:#4A5C63; --ink-faint:#7c8b90;
  --paper:#ffffff;
  --bg1:#FFF1DC; --bg2:#E7F6FF; --bg3:#FFE9F0;
  --sun:#FFD166;
  --line:#eadfce;
  --shadow-sm:0 6px 16px -8px rgba(34,51,59,.28);
  --shadow:0 20px 44px -20px rgba(34,51,59,.40);
  --radius:26px; --radius-lg:34px;
  --focus:#118AB2;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Noto Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 12% -8%, rgba(255,209,102,.55), transparent 60%),
    radial-gradient(1000px 680px at 100% 0%, rgba(46,196,182,.28), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, rgba(255,122,138,.24), transparent 55%),
    linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Jua',system-ui,sans-serif;font-weight:400;letter-spacing:.2px}

/* Ambient floating light bubbles */
.amb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.amb b{position:absolute;bottom:-80px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.9), rgba(255,255,255,.05) 62%);
  opacity:.55;animation:rise linear infinite}
.amb b:nth-child(1){left:8%;width:70px;height:70px;animation-duration:19s}
.amb b:nth-child(2){left:24%;width:38px;height:38px;animation-duration:15s;animation-delay:3s}
.amb b:nth-child(3){left:46%;width:96px;height:96px;animation-duration:24s;animation-delay:1s}
.amb b:nth-child(4){left:66%;width:46px;height:46px;animation-duration:17s;animation-delay:6s}
.amb b:nth-child(5){left:82%;width:64px;height:64px;animation-duration:21s;animation-delay:2s}
.amb b:nth-child(6){left:92%;width:32px;height:32px;animation-duration:14s;animation-delay:5s}
@keyframes rise{to{transform:translateY(-118vh) translateX(30px)}}

/* Layout */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  max-width:1160px;margin:0 auto;padding:clamp(14px,2.4vw,30px);gap:clamp(10px,1.8vh,20px)}

.topbar{display:flex;align-items:center;gap:clamp(10px,2vw,20px);
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
  border:2px solid rgba(255,255,255,.8);border-radius:20px;
  padding:clamp(8px,1.4vw,14px) clamp(12px,1.8vw,20px);box-shadow:var(--shadow-sm)}
.counter{font-family:'Jua',sans-serif;font-size:clamp(1rem,1.5vw,1.4rem);color:var(--ink);white-space:nowrap}
.counter b{color:var(--gold-deep)}
.rail{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center;min-width:0}
.drop{width:clamp(16px,2.2vw,26px);height:clamp(20px,2.7vw,32px);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
  transform:rotate(180deg);
  background:rgba(46,196,182,.16);border:2px solid rgba(46,196,182,.32);transition:.35s}
.drop.done{background:linear-gradient(180deg,var(--teal),var(--teal-deep));border-color:var(--teal-deep)}
.drop.now{background:linear-gradient(180deg,var(--sun),var(--gold));border-color:var(--gold-deep);
  box-shadow:0 0 0 4px rgba(255,159,28,.22)}
.stars{font-family:'Jua',sans-serif;font-size:clamp(1rem,1.5vw,1.4rem);white-space:nowrap;color:var(--ink)}
.icon-btn{border:2px solid rgba(34,51,59,.12);background:#fff;border-radius:14px;
  width:clamp(40px,5vw,52px);height:clamp(40px,5vw,52px);font-size:clamp(1.1rem,2vw,1.5rem);
  cursor:pointer;display:grid;place-items:center;transition:.2s;flex-shrink:0}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:clamp(14px,2.4vh,26px);padding:clamp(6px,1.2vh,16px) 0;overflow:auto;text-align:center}

.dock{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0}
.feedback{font-family:'Jua',sans-serif;font-size:clamp(1.15rem,2.4vw,2rem);min-height:1.2em;
  text-align:center;transition:.2s;opacity:0}
.feedback.show{opacity:1;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.feedback.good{color:var(--teal-deep)}
.feedback.soft{color:var(--coral-deep)}
.next-btn{font-family:'Jua',sans-serif;font-size:clamp(1.2rem,2.2vw,1.8rem);color:#fff;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));border:none;
  padding:clamp(12px,1.6vh,18px) clamp(28px,4vw,52px);border-radius:999px;cursor:pointer;
  box-shadow:0 14px 26px -12px rgba(242,125,12,.8);transition:.2s;
  animation:bob 1.4s ease-in-out infinite}
.next-btn:hover{transform:translateY(-3px) scale(1.03)}
.next-btn[hidden]{display:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Body-state visibility */
body.screen-start .topbar,body.screen-end .topbar{display:none}
body.screen-start .dock,body.screen-end .dock{display:none}

/* Question shell */
.q-head{max-width:960px}
.q-badge{display:inline-flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;
  font-size:clamp(.95rem,1.5vw,1.25rem);color:#fff;background:linear-gradient(180deg,var(--teal),var(--teal-deep));
  padding:6px 18px;border-radius:999px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.q-text{font-family:'Jua',sans-serif;font-size:clamp(1.5rem,1.8vw + 1rem,3rem);line-height:1.28;
  color:var(--ink);margin:0;text-wrap:balance}

.q-block{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,26px);animation:enter .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Options */
.opts{width:100%;max-width:900px;display:grid;grid-template-columns:1fr;gap:clamp(10px,1.6vh,16px)}
.opt{display:flex;align-items:center;gap:clamp(12px,1.6vw,18px);text-align:left;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;
  font-size:clamp(1.05rem,.6vw + .85rem,1.65rem);color:var(--ink);
  background:var(--paper);border:3px solid transparent;
  padding:clamp(14px,1.8vh,20px) clamp(16px,2vw,26px);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s,background .3s;
  min-height:clamp(62px,8.5vh,102px);width:100%}
.opt:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(46,196,182,.5)}
.opt:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 5px rgba(17,138,178,.25)}
.opt-ic{font-size:clamp(1.7rem,3vw,2.6rem);line-height:1;flex-shrink:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.opt-tx{flex:1}
.opt.is-correct{background:linear-gradient(180deg,#eafff6,#d7fbee);border-color:var(--mint);
  box-shadow:0 0 0 5px rgba(6,214,160,.22),var(--shadow);transform:translateY(-2px)}
.opt.is-correct::after{content:"✓";margin-left:auto;font-family:'Jua',sans-serif;color:var(--mint);font-size:clamp(1.4rem,3vw,2.2rem)}
.opt.is-dim{opacity:.42;filter:saturate(.6)}
.locked .opt{pointer-events:none}
.locked .swipe-card,.locked .swipe-ctl,.locked .word-chip,.locked .blank{pointer-events:none}

.wiggle{animation:wig .5s}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* Ripple + fx */
.ripple{position:fixed;width:60px;height:60px;border-radius:50%;pointer-events:none;z-index:60;
  transform:translate(-50%,-50%);border:5px solid rgba(46,196,182,.7);animation:rip .85s ease-out forwards}
@keyframes rip{to{width:520px;height:520px;opacity:0;border-width:2px}}
.fx-canvas{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ===== Q1 icon character ===== */
.char{position:relative;width:clamp(140px,20vw,200px);height:clamp(140px,20vw,200px);
  display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 50% 38%, #fff, #fff5e2 70%, #ffe6bf);
  box-shadow:var(--shadow),inset 0 0 0 6px rgba(255,209,102,.5)}
.char-emoji{font-size:clamp(4.5rem,10vw,7rem);line-height:1;transition:transform .3s}
.char .towel{position:absolute;bottom:22%;font-size:clamp(2rem,4vw,3rem);opacity:0;transform:translateY(20px) scale(.5)}
.char.served .char-emoji{animation:spin720 .95s cubic-bezier(.3,.9,.3,1)}
.char.served .towel{animation:towelIn .5s .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes spin720{to{transform:rotateY(720deg)}}
@keyframes towelIn{to{opacity:1;transform:translateY(0) scale(1)}}
.char .halo{position:absolute;inset:-14px;border-radius:50%;border:4px dashed rgba(255,159,28,.35);opacity:0}
.char.served .halo{animation:haloPulse 1.4s ease-out .5s infinite}
@keyframes haloPulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}

/* ===== Q2 초성(initial-consonant) quiz ===== */
.cho-board{display:flex;justify-content:center;gap:clamp(12px,2.4vw,24px);flex-wrap:wrap;margin:clamp(4px,1vh,12px) 0}
.cho-tile{position:relative;width:clamp(88px,13vw,140px);aspect-ratio:1;border-radius:24px;
  background:linear-gradient(160deg,var(--teal),var(--teal-deep));color:#fff;
  display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden;
  border:3px solid rgba(255,255,255,.55)}
.cho-tile::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.42),transparent 62%)}
.cho-cons,.cho-full{grid-area:1/1;font-family:'Jua',sans-serif;line-height:1;
  transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.5,.4,1)}
.cho-cons{font-size:clamp(2.7rem,6.4vw,4.6rem);letter-spacing:2px;opacity:1}
.cho-full{font-size:clamp(2.3rem,5.2vw,3.9rem);opacity:0;transform:scale(.4) rotate(-10deg)}
.cho-tile.revealed{background:linear-gradient(160deg,var(--sun),var(--gold));border-color:#fff;
  animation:choPop .55s cubic-bezier(.2,1.5,.4,1)}
.cho-tile.revealed .cho-cons{opacity:0;transform:scale(1.5)}
.cho-tile.revealed .cho-full{opacity:1;transform:none}
@keyframes choPop{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1)}}
.reveal-btn{font-family:'Jua',sans-serif;font-size:clamp(1.15rem,2vw,1.7rem);color:#fff;border:none;cursor:pointer;
  background:linear-gradient(180deg,var(--teal),var(--teal-deep));
  padding:clamp(12px,1.6vh,18px) clamp(28px,4vw,48px);border-radius:999px;
  box-shadow:0 14px 26px -12px rgba(25,154,142,.8);transition:.2s;animation:bob 1.5s ease-in-out infinite}
.reveal-btn:hover{transform:translateY(-3px) scale(1.03)}
.locked .reveal-btn{display:none}

/* Word-chip option layout (short one-word answers) */
.opts.opts-word{grid-template-columns:repeat(2,minmax(0,1fr));max-width:660px}
.opts.opts-word .opt{justify-content:center;text-align:center;font-family:'Jua',sans-serif;
  font-size:clamp(1.5rem,1vw + 1.15rem,2.3rem);min-height:clamp(74px,10vh,112px)}
.opts.opts-word .opt-tx{flex:0 1 auto}
.opts.opts-word .opt.is-correct::after{content:none}
@media(max-width:520px){.opts.opts-word{grid-template-columns:1fr}}


/* ===== Q3 hotspot ===== */
.scene{position:relative;width:100%;max-width:760px;height:clamp(190px,32vh,300px);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(180deg,#cfeeff 0%,#e9dcc0 46%,#d8c49a 100%)}
.scene .sun{position:absolute;top:14px;right:22px;font-size:clamp(2rem,4vw,3rem)}
.scene .road{position:absolute;left:0;right:0;bottom:0;height:52%;
  background:repeating-linear-gradient(90deg,#c9b17f 0 46px,#bea471 46px 92px)}
.scene .road::before{content:"";position:absolute;left:6%;right:6%;top:46%;height:5px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 52px);opacity:.55}
.scene .sandal{position:absolute;bottom:12%;font-size:clamp(2.4rem,6vw,4rem);filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.scene .s1{left:26%} .scene .s2{left:52%;transform:scaleX(-1)}
.scene .dust{position:absolute;font-size:clamp(1.2rem,2.5vw,1.8rem);opacity:.8;animation:puff 3s ease-in-out infinite}
.scene .d1{left:38%;bottom:26%} .scene .d2{left:60%;bottom:22%;animation-delay:1.2s} .scene .d3{left:20%;bottom:20%;animation-delay:.6s}
@keyframes puff{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:.9}}
.hotspot{position:absolute;top:20%;left:44%;transform:translate(-50%,-50%);width:clamp(52px,8vw,66px);height:clamp(52px,8vw,66px);
  border-radius:50%;border:none;background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#fff;
  font-family:'Jua',sans-serif;font-size:clamp(1.7rem,3.4vw,2.4rem);cursor:pointer;
  box-shadow:0 8px 18px -6px rgba(242,125,12,.9),0 0 0 0 rgba(255,159,28,.6);
  animation:beacon 1.5s ease-out infinite;z-index:3}
@keyframes beacon{0%{box-shadow:0 8px 18px -6px rgba(242,125,12,.9),0 0 0 0 rgba(255,159,28,.7)}
  100%{box-shadow:0 8px 18px -6px rgba(242,125,12,.9),0 0 0 22px rgba(255,159,28,0)}}
.tip{position:absolute;top:6%;left:50%;transform:translateX(-50%) scale(.6);opacity:0;
  background:#fff;color:var(--ink);font-family:'Jua',sans-serif;font-size:clamp(1rem,2vw,1.4rem);
  padding:8px 18px;border-radius:14px;box-shadow:var(--shadow);white-space:nowrap;z-index:4;pointer-events:none}
.tip.show{animation:pop .4s cubic-bezier(.2,1.6,.4,1) forwards}
.gate-hint{font-family:'Jua',sans-serif;color:var(--ink-soft);font-size:clamp(1rem,1.8vw,1.35rem)}
.opts.reveal{animation:enter .5s cubic-bezier(.2,.9,.3,1) both}

/* ===== Q4 fill in blank ===== */
.sentence{font-family:'Jua',sans-serif;font-size:clamp(1.5rem,1.6vw + 1rem,2.7rem);line-height:1.7;
  color:var(--ink);max-width:900px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(120px,18vw,200px);
  min-height:clamp(48px,6vw,68px);margin:0 6px;padding:2px 14px;border-radius:16px;vertical-align:middle;
  border:3px dashed var(--teal);background:rgba(46,196,182,.1);cursor:pointer;transition:.2s;
  font-size:clamp(1.2rem,1.4vw + .8rem,2.1rem)}
.blank.filled{border-style:solid;background:linear-gradient(180deg,#fff,#f4fffb);color:var(--teal-deep)}
.blank.ok{border-color:var(--mint);background:linear-gradient(180deg,#eafff6,#d7fbee)}
.chips{display:flex;flex-wrap:wrap;gap:clamp(10px,1.6vw,16px);justify-content:center;max-width:760px}
.word-chip{font-family:'Noto Sans KR';font-weight:700;font-size:clamp(1.05rem,1.6vw,1.6rem);color:var(--ink);
  background:var(--paper);border:3px solid var(--line);border-radius:16px;
  padding:clamp(10px,1.4vh,16px) clamp(16px,2.2vw,26px);cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .16s,box-shadow .16s}
.word-chip:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:var(--shadow)}
.word-chip.used{opacity:.28;pointer-events:none;transform:scale(.9)}
.word-chip:nth-child(odd){transform:rotate(-2deg)}
.word-chip:nth-child(even){transform:rotate(2deg)}

/* ===== Q5 chat ===== */
.phone{width:100%;max-width:460px;background:#dff1ff;border-radius:34px;padding:16px 14px 18px;
  box-shadow:var(--shadow),inset 0 0 0 6px #fff;border:2px solid #cfe7fb}
.phone-top{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;border-bottom:2px solid #cfe7fb;margin-bottom:10px}
.phone-top .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--sun),var(--gold));display:grid;place-items:center;font-size:1.3rem}
.phone-top .nm{font-family:'Jua',sans-serif;font-size:1.2rem;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:clamp(200px,34vh,320px);justify-content:flex-end}
.bubble{max-width:82%;padding:10px 15px;border-radius:18px;font-size:clamp(.95rem,1.5vw,1.25rem);line-height:1.4;
  font-weight:500;box-shadow:var(--shadow-sm);animation:bubIn .35s cubic-bezier(.2,1.3,.4,1) both}
.bubble.left{align-self:flex-start;background:#fff;color:var(--ink);border-bottom-left-radius:6px}
.bubble.right{align-self:flex-end;background:linear-gradient(180deg,#ffe39c,var(--gold));color:#5a3800;border-bottom-right-radius:6px}
.bubble .who{display:block;font-family:'Jua',sans-serif;font-size:.8rem;opacity:.7;margin-bottom:2px}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.bubble.tap{align-self:flex-start;background:#fff;cursor:pointer;border:3px solid var(--teal);
  font-family:'Jua',sans-serif;color:var(--teal-deep);animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(46,196,182,.5)}50%{box-shadow:0 0 0 8px rgba(46,196,182,0)}}
.typing{align-self:flex-start;background:#fff;padding:12px 16px;border-radius:18px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:#b8c6cc;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.chat-opts{margin-top:12px}

/* ===== Q6 swipe ===== */
.swipe-wrap{position:relative;width:100%;max-width:640px;display:flex;align-items:stretch;gap:10px;justify-content:center}
.swipe-side{flex:0 0 clamp(58px,10vw,110px);border-radius:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;font-family:'Jua',sans-serif;white-space:pre-line;
  font-size:clamp(.8rem,1.4vw,1.05rem);text-align:center;padding:8px;transition:.2s;border:3px solid transparent}
.swipe-side .se{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.swipe-side.bad{background:rgba(255,122,138,.14);color:var(--coral-deep)}
.swipe-side.good{background:rgba(6,214,160,.14);color:var(--teal-deep)}
.swipe-side.lit-bad{border-color:var(--coral);background:rgba(255,122,138,.3);transform:scale(1.04)}
.swipe-side.lit-good{border-color:var(--mint);background:rgba(6,214,160,.3);transform:scale(1.04)}
.swipe-stack{position:relative;flex:1;height:clamp(230px,38vh,340px)}
.swipe-card{position:absolute;inset:0;background:var(--paper);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:clamp(18px,3vw,30px);text-align:center;cursor:grab;
  border:3px solid var(--line);touch-action:none;user-select:none;transition:transform .25s ease,opacity .25s}
.swipe-card.active{cursor:grab}
.swipe-card .sc-em{font-size:clamp(2.6rem,6vw,4rem)}
.swipe-card .sc-tx{font-family:'Noto Sans KR';font-weight:700;font-size:clamp(1.1rem,1.8vw,1.65rem);line-height:1.35;color:var(--ink)}
.swipe-card .stamp{position:absolute;top:16px;font-family:'Jua',sans-serif;font-size:clamp(1.4rem,3vw,2.2rem);
  padding:4px 16px;border-radius:12px;opacity:0;transition:.1s}

<script>

/* ================= Data ================= */
const QUESTIONS = [

  { type:"finale",

      {text:"선생님께 칭찬을 듣고 상을 받게 돼요"},
    ],
    win:"친구가 날마다 더해져요! 사랑이 가득한 소그룹 🎉" },

const NUDGES = ["다시 생각해 볼까요? 🤔","조금만 더 생각해 봐요! 💭","괜찮아요, 다시 한 번! 😊","힌트를 떠올려 볼까요? ✨"];
const CONFETTI_COLORS = ["#FF9F1C","#2EC4B6","#06D6A0","#FF7A8A","#FFD166","#118AB2"];

/* ================= State & refs ================= */
const state = { index:0, correct:0, answered:false };
const stage    = document.getElementById("stage");
const feedback = document.getElementById("feedback");
const nextBtn  = document.getElementById("nextBtn");
const rail     = document.getElementById("rail");
const curNum   = document.getElementById("curNum");
const starsEl  = document.getElementById("stars");

/* ================= Tiny DOM helper ================= */
function el(tag, opts, ...kids){
  const n = document.createElement(tag);
  opts = opts || {};
  if(opts.class) n.className = opts.class;
  if(opts.html  != null) n.innerHTML   = opts.html;
  if(opts.text  != null) n.textContent = opts.text;
  if(opts.style) n.style.cssText = opts.style;
  if(opts.attrs) for(const k in opts.attrs) n.setAttribute(k, opts.attrs[k]);
  if(opts.on)    for(const k in opts.on)    n.addEventListener(k, opts.on[k]);
  for(const kid of kids){
    if(kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ================= Audio (WebAudio, no assets) ================= */
let AC = null, muted = false;
function initAudio(){
  try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(AC && AC.state === "suspended") AC.resume();
}
function tone(freq, start, dur, type, vol){
  if(!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||"sine"; o.frequency.value = freq;
  o.connect(g); g.connect(AC.destination);
  const t = AC.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.15, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.03);
}
function chimeCorrect(){ initAudio(); [[523.25,0],[659.25,.09],[783.99,.18],[1046.5,.3]].forEach(p=>tone(p[0],p[1],.3,"triangle",.16)); }
function chimeWrong(){ initAudio(); tone(311.13,0,.22,"sine",.12); tone(233.08,.09,.3,"sine",.10); }
function chimePop(){ initAudio(); tone(880,0,.07,"square",.05); }

/* ================= FX: confetti + ripple ================= */
function burst(opts){
  if(window.confetti){ window.confetti(Object.assign({colors:CONFETTI_COLORS}, opts)); }
}
function celebrate(originEl){
  if(window.confetti){
    burst({particleCount:100,spread:72,startVelocity:46,origin:{y:.68}});
    setTimeout(()=>burst({particleCount:60,angle:60,spread:60,origin:{x:0,y:.72}}),110);
    setTimeout(()=>burst({particleCount:60,angle:120,spread:60,origin:{x:1,y:.72}}),220);
  } else fallbackConfetti();
  if(originEl) ripple(originEl);
}
function grandFinale(){
  if(!window.confetti){ fallbackConfetti(); return; }
  const end = Date.now() + 2200;
  (function frame(){
    burst({particleCount:6,angle:60,spread:70,startVelocity:55,origin:{x:0}});
    burst({particleCount:6,angle:120,spread:70,startVelocity:55,origin:{x:1}});
    if(Date.now() < end) requestAnimationFrame(frame);
  })();
  burst({particleCount:160,spread:100,startVelocity:50,origin:{y:.6}});
}
function ripple(originEl){
  const r = originEl.getBoundingClientRect();
  const d = el("div",{class:"ripple"});
  d.style.left = (r.left + r.width/2) + "px";
  d.style.top  = (r.top + r.height/2) + "px";
  document.body.append(d);
  setTimeout(()=>d.remove(), 900);
}
function fallbackConfetti(){
  const cv = el("canvas",{class:"fx-canvas"}); document.body.append(cv);
  const ctx = cv.getContext("2d");
  let W = cv.width = innerWidth, H = cv.height = innerHeight;
  const P = [];
  for(let i=0;i<150;i++) P.push({x:Math.random()*W,y:-20-Math.random()*H*.3,r:6+Math.random()*8,
    c:CONFETTI_COLORS[i%CONFETTI_COLORS.length],vy:2+Math.random()*4,vx:-2+Math.random()*4,
    rot:Math.random()*6,vr:-.2+Math.random()*.4});
  let t=0;
  (function loop(){
    t++; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); ctx.restore(); }
    if(t<170) requestAnimationFrame(loop); else cv.remove();
  })();
}

/* ================= Feedback / flow ================= */
function showFeedback(msg, kind){
  feedback.textContent = msg;
  feedback.className = "feedback show " + (kind||"");
}
function clearFeedback(){ feedback.textContent=""; feedback.className="feedback"; }

function showNext(label){
  nextBtn.textContent = label || "다음 문제 →";
  nextBtn.hidden = false;
  nextBtn.focus();
}

function markCorrect(originEl, opts){
  opts = opts || {};
  if(state.answered) return;
  state.answered = true;
  state.correct++;
  updateTopbar();
  const q = QUESTIONS[state.index];
  showFeedback(opts.msg || q.win || "정답이에요! 🎉", "good");
  chimeCorrect();
  if(opts.grand) grandFinale(); else celebrate(originEl || stage);
  stage.classList.add("locked");
  if(!opts.suppressNext){
    const last = state.index === QUESTIONS.length-1;
    showNext(last ? "결과 보기 🎊" : "다음 문제 →");
  }
}
function finishCorrect(container, correctBtn, opts){
  if(container && correctBtn){
    correctBtn.classList.add("is-correct");
    container.querySelectorAll(".opt").forEach(b=>{ if(b!==correctBtn) b.classList.add("is-dim"); });
  }
  markCorrect(correctBtn || stage, opts);
}
function nudge(elm, msg){
  if(state.answered) return;
  showFeedback(msg || NUDGES[(Math.random()*NUDGES.length)|0], "soft");
  chimeWrong();
  if(elm){ elm.classList.remove("wiggle"); void elm.offsetWidth; elm.classList.add("wiggle"); }
}

/* Shared option list builder */
function buildOptions(q, onPick, extraClass){
  const wrap = el("div",{class:"opts" + (extraClass?(" "+extraClass):"")});
  q.options.forEach(o=>{
    const b = el("button",{class:"opt",attrs:{type:"button"}});
    if(o.icon) b.append(el("span",{class:"opt-ic",text:o.icon}));
    b.append(el("span",{class:"opt-tx",text:o.text}));
    b.addEventListener("click",()=>onPick(o,b,wrap));
    wrap.append(b);
  });
  return wrap;
}
function head(q){
  return el("div",{class:"q-head"},
    el("div",{class:"q-badge",html:"💧 문제 " + (state.index+1)}),
    el("h2",{class:"q-text",text:q.q})
  );
}
function block(){ return el("div",{class:"q-block"}); }

/* ================= Renderers ================= */

function renderChosung(q){
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const chosungOf = ch => { const c = ch.charCodeAt(0) - 0xAC00; return (c<0||c>11171) ? ch : CHO[(c/588)|0]; };
  const b = block();
  b.append(head(q));
  b.append(el("div",{class:"gate-hint",text:"초성을 보고 낱말을 맞혀 본 뒤, 버튼을 눌러 정답을 확인해요! 🔤"}));

  const tiles = [];
  const board = el("div",{class:"cho-board"});
  for(const ch of q.answerWord){
    const t = el("div",{class:"cho-tile"},
      el("span",{class:"cho-cons",text:chosungOf(ch)}),
      el("span",{class:"cho-full",text:ch})
    );
    tiles.push(t); board.append(t);
  }
  b.append(board);

  const revealBtn = el("button",{class:"reveal-btn",attrs:{type:"button"},text:"정답 확인하기 ✨"});
  revealBtn.addEventListener("click",()=>{
    if(state.answered) return;
    revealBtn.remove();
    finishCorrect(null, null, {suppressNext:true});
    tiles.forEach((t,i)=> setTimeout(()=>{ t.classList.add("revealed"); chimePop(); }, 180 + i*300));
    const done = 180 + tiles.length*300 + 280;
    setTimeout(()=>{
      const last = state.index === QUESTIONS.length-1;
      showNext(last ? "결과 보기 🎊" : "다음 문제 →");
    }, done);
  });
  b.append(revealBtn);
  return b;
}

function renderBlank(q){
  const b = block();
  b.append(head(q));

  const ANSWER = ["사랑한 것","사랑하라"];
  const blank1 = el("span",{class:"blank",attrs:{tabindex:"0",role:"button"},text:"?"});
  const blank2 = el("span",{class:"blank",attrs:{tabindex:"0",role:"button"},text:"?"});
  const blanks = [blank1, blank2];

  const sentence = el("div",{class:"sentence"},
    "내가 너희를 ", blank1, " 같이 너희도 서로 ", blank2
  );
  b.append(sentence);

  const words = shuffle(["사랑한 것","미워한 것","사랑하라","자랑하라"]);
  const chips = el("div",{class:"chips"});
  const chipFor = {};
  words.forEach(w=>{
    const chip = el("button",{class:"word-chip",attrs:{type:"button"},text:w});
    chipFor[w] = chip;
    chip.addEventListener("click",()=>{
      if(chip.classList.contains("used")) return;
      const slot = blanks.find(s=>!s.dataset.word);
      if(!slot) return;
      slot.textContent = w; slot.dataset.word = w;
      slot.classList.add("filled");
      chip.classList.add("used");
      chimePop();
      check();
    });
    chips.append(chip);
  });

  function releaseSlot(slot){
    const w = slot.dataset.word;
    if(!w || state.answered) return;
    slot.textContent = "?"; slot.dataset.word = "";
    slot.classList.remove("filled");
    if(chipFor[w]) chipFor[w].classList.remove("used");
    clearFeedback();
  }
  blank1.addEventListener("click",()=>releaseSlot(blank1));
  blank2.addEventListener("click",()=>releaseSlot(blank2));
  blank1.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();releaseSlot(blank1);} });
  blank2.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();releaseSlot(blank2);} });

  function check(){
    if(blank1.dataset.word && blank2.dataset.word){
      if(blank1.dataset.word===ANSWER[0] && blank2.dataset.word===ANSWER[1]){
        blank1.classList.add("ok"); blank2.classList.add("ok");
        markCorrect(sentence);
      } else {
        nudge(sentence, "음, 짝이 안 맞아요! 단어를 다시 골라 볼까요? 💭");
        setTimeout(()=>{ if(!state.answered){ releaseSlot(blank1); releaseSlot(blank2); } }, 900);
      }
    }
  }
  b.append(chips);
  return b;
}

  const script = [
    {who:"예수님", side:"left",  t:"베드로야, 네가 나를 사랑하느냐?"},
    {who:"베드로", side:"right", t:"주님, 그렇습니다. 제가 주님을 사랑하는 줄 주님께서 아십니다."},
    {who:"예수님", side:"left",  t:"베드로야, 네가 진정 나를 사랑하느냐?"},
    {who:"베드로", side:"right", t:"주님, 모든 것을 아십니다. 제가 주님을 사랑하는 줄 아십니다."},
  ];

  let i = 0;
  function addTyping(){
    const t = el("div",{class:"typing"}, el("i"), el("i"), el("i"));
    chat.append(t); chat.scrollTop = chat.scrollHeight;
    return t;
  }
  function step(){
    if(i >= script.length){ showTap(); return; }
    const typing = addTyping();
    setTimeout(()=>{
      typing.remove();
      const m = script[i];
      chat.append(el("div",{class:"bubble "+m.side},
        el("span",{class:"who",text:m.who}), m.t));
      chat.scrollTop = chat.scrollHeight;
      chimePop();
      i++;
      setTimeout(step, 700);
    }, 650);
  }
  function showTap(){
    const tap = el("div",{class:"bubble tap",attrs:{role:"button",tabindex:"0"},
      text:"💬 예수님의 대답 보기 (눌러 주세요)"});

      opts.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    tap.addEventListener("click",reveal);
    tap.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal();} });
    chat.append(tap); chat.scrollTop = chat.scrollHeight;
  }
  setTimeout(step, 350);
  return b;
}

function renderSwipe(q){
  const b = block();
  b.append(head(q));

  const cardsData = shuffle([
    {em:"🙏", t:"아픈 가족이 있는 친구를 위해 함께 기도해요", good:true},
    {em:"💬", t:"친구가 겪은 일을 물어보며 관심을 가져요", good:true},
    {em:"🎵", t:"새로 온 친구에게 찬송을 가르쳐 주며 친근하게 대해요", good:true},
    {em:"🚫", t:"친구가 잘못하면 소그룹에 못 오게 해요", good:false},
  ]);

  const leftSide  = el("div",{class:"swipe-side bad"},  el("div",{class:"se",text:"🥲"}), "아쉬운\n행동");
  const rightSide = el("div",{class:"swipe-side good"}, el("div",{class:"se",text:"🥰"}), "사랑의\n행동");
  const stack = el("div",{class:"swipe-stack"});
  const wrap = el("div",{class:"swipe-wrap"}, leftSide, stack, rightSide);
  b.append(wrap);

  const ctl = el("div",{class:"swipe-ctl"},
    el("button",{class:"cbad",attrs:{type:"button"},text:"👈 아쉬운"}),
    el("button",{class:"cgood",attrs:{type:"button"},text:"사랑의 👉"})
  );
  b.append(ctl);
  const status = el("div",{class:"swipe-done",text:"카드를 좌우로 밀어 분류해요 (버튼도 가능!)"});
  b.append(status);

  const cardEls = [];
  cardsData.forEach((d,idx)=>{
    const card = el("div",{class:"swipe-card"},
      el("div",{class:"stamp good",text:"사랑 ✓"}),
      el("div",{class:"stamp bad",text:"아쉬움"}),
      el("div",{class:"sc-em",text:d.em}),
      el("div",{class:"sc-tx",text:d.t})
    );
    card._data = d;
    // depth stacking: first card on top
    const depth = idx;
    card.style.zIndex = String(cardsData.length - idx);
    card.style.transform = `translateY(${depth*10}px) scale(${1-depth*0.04})`;
    stack.append(card);
    cardEls.push(card);
  });

  let active = 0, sorted = 0;
  function setActive(){
    cardEls.forEach((c,i)=>{
      c.classList.toggle("active", i===active);
    });
    if(cardEls[active]) attachDrag(cardEls[active]);
  }

  function decide(card, side){
    if(state.answered || !card) return;
    const correctSide = card._data.good ? "right" : "left";
    if(side === correctSide){
      const dir = side==="right" ? 1 : -1;
      card.style.transition = "transform .4s ease, opacity .4s";
      card.style.transform = `translateX(${dir*140}%) rotate(${dir*22}deg)`;
      card.style.opacity = "0";
      chimePop();
      sorted++;
      setTimeout(()=>card.remove(), 380);
      active++;
      // restack remaining
      cardEls.slice(active).forEach((c,i)=>{
        c.style.transition="transform .3s";
        c.style.transform = `translateY(${i*10}px) scale(${1-i*0.04})`;
      });
      if(sorted === cardsData.length){
        status.textContent = "분류 완료! 🎉";
        markCorrect(stack);
      } else {
        setActive();
      }
    } else {
      // wrong side -> spring back
      card.style.transition = "transform .3s cubic-bezier(.3,1.4,.4,1)";
      card.style.transform = "translateY(0) scale(1)";
      leftSide.classList.remove("lit-bad"); rightSide.classList.remove("lit-good");
      card.querySelector(".stamp.good").style.opacity="0";
      card.querySelector(".stamp.bad").style.opacity="0";
      nudge(card, "그쪽이 아니에요! 다시 밀어 볼까요? 🤔");
    }
  }

  function attachDrag(card){
    if(card._dragReady) return;
    card._dragReady = true;
    let startX=0, startY=0, dx=0, dragging=false, pid=null;
    const TH = 100;
    card.addEventListener("pointerdown",e=>{
      if(state.answered) return;
      dragging=true; pid=e.pointerId; startX=e.clientX; startY=e.clientY; dx=0;
      card.setPointerCapture(pid);
      card.style.transition="none"; card.style.cursor="grabbing";
    });
    card.addEventListener("pointermove",e=>{
      if(!dragging) return;
      dx = e.clientX - startX;
      const dy = e.clientY - startY;
      card.style.transform = `translate(${dx}px,${dy*0.25}px) rotate(${dx*0.06}deg)`;
      const gp = card.querySelector(".stamp.good"), bp = card.querySelector(".stamp.bad");
      gp.style.opacity = dx>30 ? String(Math.min(1,(dx-30)/70)) : "0";
      bp.style.opacity = dx<-30 ? String(Math.min(1,(-dx-30)/70)) : "0";
      rightSide.classList.toggle("lit-good", dx>TH);
      leftSide.classList.toggle("lit-bad", dx<-TH);
    });
    function end(){
      if(!dragging) return;
      dragging=false; card.style.cursor="grab";
      try{ card.releasePointerCapture(pid); }catch(e){}
      rightSide.classList.remove("lit-good"); leftSide.classList.remove("lit-bad");
      if(dx > TH) decide(card,"right");
      else if(dx < -TH) decide(card,"left");
      else { card.style.transition="transform .25s"; card.style.transform="translateY(0) scale(1)";
        card.querySelector(".stamp.good").style.opacity="0"; card.querySelector(".stamp.bad").style.opacity="0"; }
    }
    card.addEventListener("pointerup",end);
    card.addEventListener("pointercancel",end);
  }

  ctl.children[0].addEventListener("click",()=>decide(cardEls[active],"left"));
  ctl.children[1].addEventListener("click",()=>decide(cardEls[active],"right"));

  setActive();
  return b;
}

/* ================= Engine ================= */
function buildRail(){
  rail.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++) rail.append(el("div",{class:"drop"}));
}
function updateTopbar(){
  curNum.textContent = String(state.index+1);
  starsEl.textContent = "⭐ " + state.correct;
  const drops = rail.children;
  for(let i=0;i<drops.length;i++){
    drops[i].className = "drop" + (i<state.index?" done":"") + (i===state.index?" now":"");
  }
}
function loadQuestion(){
  state.answered = false;
  document.body.className = "screen-quiz";
  stage.classList.remove("locked");
  stage.innerHTML = "";
  clearFeedback();
  nextBtn.hidden = true;
  updateTopbar();
  const q = QUESTIONS[state.index];
  stage.append(RENDERERS[q.type](q));
  stage.scrollTop = 0;
}

function showStart(){
  document.body.className = "screen-start";
  stage.classList.remove("locked");
  clearFeedback(); nextBtn.hidden = true;
  stage.innerHTML = "";
  stage.append(el("div",{class:"hero"},
    el("div",{class:"eyebrow",text:"2026 여름 어린이 특별집회 초고4 · 퀴즈"}),

    el("button",{class:"big-btn",attrs:{type:"button"},text:"퀴즈 시작하기 ✨",
      on:{click:()=>{ initAudio(); state.index=0; state.correct=0; loadQuestion(); }}}),
  ));
}

function showEnd(){
  document.body.className = "screen-end";
  stage.classList.remove("locked");
  stage.innerHTML = "";
  const score = state.correct, total = QUESTIONS.length;
  let medal = "🌟", line = "";
  if(score === total){ medal = "🏆"; line = "완벽해요! 모든 문제를 맞혔어요!"; }
  else if(score >= total*0.7){ medal = "🥇"; line = "정말 잘했어요! 훌륭해요!"; }
  else if(score >= total*0.4){ medal = "🥈"; line = "좋아요! 조금만 더 힘내요!"; }
  else { medal = "🌱"; line = "괜찮아요! 다시 도전해 볼까요?"; }

  stage.append(el("div",{class:"hero"},
    el("div",{class:"medal",text:medal}),
    el("h1",{text:"모든 퀴즈를 마쳤어요!"}),
    el("div",{class:"score-num",html: score + "<small> / " + total + " 정답</small>"}),
    el("p",{class:"lead",text:line}),
    el("p",{class:"lead",style:"color:var(--teal-deep)",text:"예수님처럼 낮은 자리에서 서로 사랑하며 섬기는 우리가 되어요 🤍"}),
    el("button",{class:"big-btn",attrs:{type:"button"},text:"다시 하기 ↻",
      on:{click:showStart}})
  ));
  setTimeout(grandFinale, 250);
}

/* Buttons */
nextBtn.addEventListener("click",()=>{
  if(state.index < QUESTIONS.length-1){ state.index++; loadQuestion(); }
  else showEnd();
});
document.getElementById("restartBtn").addEventListener("click",showStart);
document.getElementById("soundBtn").addEventListener("click",function(){
  muted = !muted;
  this.textContent = muted ? "🔇" : "🔊";
  if(!muted){ initAudio(); chimePop(); }
});

/* Keyboard: Enter advances when Next is visible */
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !nextBtn.hidden && document.activeElement!==nextBtn){
    if(document.activeElement.classList && document.activeElement.classList.contains("opt")) return;
    nextBtn.click();
  }
});

/* Init */
buildRail();
showStart();
</script>
</body>
</html>
