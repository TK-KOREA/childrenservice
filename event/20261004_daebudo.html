<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유초등부 야외 섞임 | 대부도 1박 2일</title>
<!-- 카톡 링크 미리보기에 보이는 제목과 설명 -->
<meta property="og:type" content="website">
<meta property="og:title" content="유초등부 전체 야외 섞임 | 대부도 1박 2일">
<meta property="og:description" content="10월 4일(일) 오후 1시 30분 출발. 참석 회신을 보내 주세요.">
<meta name="description" content="10월 4일(일) 오후 1시 30분 출발. 참석 회신을 보내 주세요.">
<meta name="theme-color" content="#F2F6F6">
<style>
  html, body { margin: 0; height: 100%; background: #F2F6F6; }
  body {
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    color: #5D6D74;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #F2F6F6; text-align: center; padding: 24px; font-size: 15px;
    transition: opacity .3s ease;
  }
  .loading.gone { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid #E4F1F1; border-top-color: #2A7C85;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .loading p { margin: 0; }
  .loading a {
    display: inline-block; margin-top: 4px; padding: 10px 18px; border-radius: 12px;
    color: #1F5F66; font-weight: 700; text-decoration: none; box-shadow: inset 0 0 0 1.5px #2A7C85;
  }
</style>
</head>
<body>
  <div class="loading" id="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <p>안내 페이지를 불러오는 중이에요</p>
    <p id="fallback" hidden>화면이 계속 안 열리면<br><a id="direct" target="_top">여기를 눌러 주세요</a></p>
  </div>
  <iframe id="app" title="유초등부 야외 섞임 참석 회신"></iframe>

  <script>
    // ▼ Apps Script 웹 앱 URL(/exec로 끝나는 주소)을 여기에 넣으세요
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbywtw0tTh-0FwjzphS9kNltJcpiZSyL5G-ZVkB3fQWG5kd4dZmGOeCVAjA15AI7TfZbyg/exec';

    var app = document.getElementById('app');
    var loading = document.getElementById('loading');
    document.getElementById('direct').href = WEB_APP_URL;
    app.addEventListener('load', function () { loading.classList.add('gone'); });
    app.src = WEB_APP_URL;
    // 8초가 지나도 안 열리면 직접 열기 링크를 보여 줌
    setTimeout(function () { document.getElementById('fallback').hidden = false; }, 8000);
  </script>
</body>
</html>
