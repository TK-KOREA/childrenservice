<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누가복음 9주 - 십자가에 못 박히심과 죽으심 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#FDF0EC;color:#4A3228;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:1.2rem 1rem 3rem}

.hero{text-align:center;padding:2rem 1rem 1.5rem;background:#fff;border-radius:20px;border:2.5px solid #F2B8A8;margin-bottom:1.25rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#F2A8A0,#F7C9A0,#F2A8A0)}
.hero-deco{font-size:14px;letter-spacing:4px;margin-bottom:6px}
.hero h1{font-size:20px;font-weight:900;color:#C0533A;line-height:1.6;letter-spacing:-0.3px}
.hero .sub{font-size:12px;color:#C4917E;margin-top:8px;font-weight:500}
.hero .verse{font-size:11px;color:#D4907C;margin-top:10px;padding:8px 14px;background:#FFF5F2;border-radius:10px;display:inline-block;line-height:1.6}

.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding:0 4px}
.prog-track{flex:1;height:8px;background:#F5DDD5;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#F2A8A0,#E8826E);border-radius:4px;transition:width 0.5s ease}
.prog-text{font-size:12px;font-weight:700;color:#D4756A;min-width:40px;text-align:right}

.card{background:#fff;border-radius:18px;padding:1.5rem 1.25rem;border:2px solid #F5DDD5;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px}
.card.type-choice::before{background:linear-gradient(90deg,#F2A8A0,#E8826E)}
.card.type-ox::before{background:linear-gradient(90deg,#E8826E,#D4605A)}
.card.type-initial::before{background:linear-gradient(90deg,#F5C97D,#EDAA55)}
.card.type-blank::before{background:linear-gradient(90deg,#8BC6A8,#5EAD83)}
.card.type-match::before{background:linear-gradient(90deg,#A7BFEE,#7A9BD9)}

.type-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:14px}
.type-choice .type-badge{background:#FFF0EE;color:#D4605A}
.type-ox .type-badge{background:#FFEAE7;color:#C04A42}
.type-initial .type-badge{background:#FFF6E5;color:#C48A30}
.type-blank .type-badge{background:#E8F5EE;color:#4A9A6E}
.type-match .type-badge{background:#EEF2FB;color:#5A7DC0}

.q-num-circle{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#F2A8A0;color:#fff;font-size:12px;font-weight:900;margin-right:8px;vertical-align:middle}
.q-text{font-size:16px;font-weight:600;line-height:1.85;margin-bottom:1rem;word-break:keep-all;color:#4A3228}
.q-text .hl{background:linear-gradient(transparent 55%,#FDDFC7 55%);padding:0 2px}

/* Hint */
.hint-wrap{margin-bottom:1rem}
.hint-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:1.5px dashed #F5C97D;background:#FFFBF2;color:#C48A30;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.hint-btn:hover{background:#FFF6E5;border-color:#EDAA55}
.hint-btn .icon{font-size:14px}
.hint-content{margin-top:8px;padding:10px 14px;border-radius:10px;background:#FFFBF2;border:1.5px solid #F5E4C0;font-size:13px;color:#A07030;line-height:1.7;display:none;font-weight:500}
.hint-content.show{display:block;animation:fadeIn 0.3s ease}

/* Choice */
.opts{display:flex;flex-direction:column;gap:8px}
.opt-btn{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #F5DDD5;background:#fff;color:#4A3228;font-size:14px;line-height:1.5;cursor:pointer;transition:all 0.2s;font-family:inherit;display:flex;align-items:center;gap:10px}
.opt-btn:hover:not(.locked){border-color:#E8B0A0;background:#FFF8F6}
.opt-btn .num{width:26px;height:26px;border-radius:50%;background:#FFF0EE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#D4756A;flex-shrink:0;transition:all 0.2s}
.opt-btn.correct{border-color:#5EAD83;background:#E8F5EE}.opt-btn.correct .num{background:#5EAD83;color:#fff}
.opt-btn.incorrect{border-color:#D4605A;background:#FFEAE7}.opt-btn.incorrect .num{background:#D4605A;color:#fff}
.opt-btn.locked{cursor:default;opacity:0.45}.opt-btn.correct.locked,.opt-btn.incorrect.locked{opacity:1}

/* OX */
.ox-row{display:flex;gap:12px}
.ox-btn{flex:1;padding:18px;border-radius:14px;border:2px solid #F5DDD5;background:#fff;font-size:30px;font-weight:900;cursor:pointer;transition:all 0.2s;font-family:inherit;text-align:center}
.ox-btn:hover:not(.locked){border-color:#E8B0A0;background:#FFF8F6}
.ox-btn.o-btn{color:#5A8FC0}.ox-btn.x-btn{color:#D4605A}
.ox-btn.correct{border-color:#5EAD83;background:#E8F5EE;color:#3E8A5E}
.ox-btn.incorrect{border-color:#D4605A;background:#FFEAE7;color:#D4605A}
.ox-btn.locked{cursor:default;opacity:0.35}.ox-btn.correct.locked,.ox-btn.incorrect.locked{opacity:1}

/* Initial */
.initial-display{text-align:center;margin-bottom:1rem}
.initial-letters{display:flex;gap:10px;justify-content:center}
.letter-box{width:54px;height:54px;border-radius:12px;background:#FFF6E5;border:2.5px solid #F5C97D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#C48A30}
.input-row{display:flex;gap:8px;align-items:center}
.text-input{flex:1;padding:12px 14px;border-radius:12px;border:2px solid #F5DDD5;font-size:15px;font-family:inherit;outline:none;transition:border-color 0.2s;color:#4A3228;background:#fff}
.text-input:focus{border-color:#F2A8A0}
.text-input::placeholder{color:#D4B8AE}
.submit-btn{padding:12px 18px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;color:#fff}
.submit-btn.initial-submit{background:#F5C97D}.submit-btn.initial-submit:hover{background:#EDAA55}
.submit-btn.blank-submit{background:#5EAD83}.submit-btn.blank-submit:hover{background:#4A9A6E}
.text-input.correct-input{border-color:#5EAD83;background:#E8F5EE}
.text-input.incorrect-input{border-color:#D4605A;background:#FFEAE7}

/* Blank */
.blank-sentence{font-size:15px;line-height:2.1;word-break:keep-all}
.blank-slot{display:inline-block;min-width:70px;border-bottom:2.5px solid #5EAD83;text-align:center;font-weight:700;color:#5EAD83;padding:0 4px;margin:0 2px}

/* Match */
.match-container{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.match-item{display:flex;gap:8px;align-items:center}
.match-q{flex:0 0 48%;padding:10px 12px;border-radius:10px;background:#EEF2FB;font-size:12.5px;line-height:1.5;color:#4A6AA0;font-weight:600}
.match-a-slot{flex:1;padding:10px 12px;border-radius:10px;border:2px dashed #C8D4E8;min-height:40px;font-size:12.5px;display:flex;align-items:center;justify-content:center;color:#A0AEC0;cursor:pointer;transition:all 0.2s}
.match-a-slot.filled{border-style:solid;border-color:#7A9BD9;background:#EEF2FB;color:#4A6AA0;font-weight:600}
.match-a-slot.correct-slot{border-color:#5EAD83;background:#E8F5EE;color:#3E8A5E;border-style:solid}
.match-a-slot.wrong-slot{border-color:#D4605A;background:#FFEAE7;color:#D4605A;border-style:solid}
.match-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.match-chip{padding:8px 14px;border-radius:20px;border:2px solid #F5DDD5;background:#fff;font-size:13px;cursor:pointer;transition:all 0.2s;font-family:inherit;color:#4A3228;font-weight:500}
.match-chip:hover:not(.used):not(.locked){background:#FFF8F6;border-color:#E8B0A0}
.match-chip.used{opacity:0.25;cursor:default}
.match-chip.locked{cursor:default}
.match-check-btn{margin-top:10px;padding:10px 20px;border-radius:12px;border:none;background:#7A9BD9;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.match-check-btn:hover{background:#5A7DC0}
.match-check-btn:disabled{opacity:0.35;cursor:default}

/* Explanation */
.explanation{margin-top:1rem;padding:12px 16px;border-radius:12px;background:#FFF5F2;font-size:13px;color:#8A6050;line-height:1.8;display:none;border-left:4px solid #F2A8A0}
.explanation.show{display:block;animation:fadeIn 0.3s ease}
.explanation b{color:#C0533A}
.correct-ans-text{display:block;margin-top:6px;font-weight:700;color:#4A9A6E;font-size:14px}

/* Next */
.next-btn{margin-top:1.25rem;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#F2A8A0,#E8826E);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:none;transition:opacity 0.2s;letter-spacing:0.5px}
.next-btn:hover{opacity:0.9}
.next-btn.show{display:block;animation:fadeIn 0.3s ease}

/* Result */
.result{text-align:center;padding:2rem 0.5rem}
.result-stars{font-size:28px;letter-spacing:4px;margin-bottom:8px}
.result-score{font-size:52px;font-weight:900;color:#C0533A}
.result-label{font-size:13px;color:#C4917E;margin-top:2px;font-weight:500}
.result-detail{margin-top:1.5rem;display:flex;justify-content:center;gap:24px}
.result-stat{text-align:center}
.result-stat .val{font-size:28px;font-weight:900}
.result-stat .lbl{font-size:11px;color:#C4917E;margin-top:2px;font-weight:500}
.result-stat.green .val{color:#4A9A6E}
.result-stat.red .val{color:#D4605A}
.result-msg{font-size:15px;line-height:1.8;margin-top:1.5rem;word-break:keep-all;color:#6A4A3E;background:#FFF5F2;padding:14px 18px;border-radius:14px;border:1.5px solid #F5DDD5}
.retry-btn{margin-top:1.5rem;padding:14px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,#F2A8A0,#E8826E);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.5px}
.retry-btn:hover{opacity:0.9}

/* Review */
.review-section{margin-top:1.5rem;text-align:left}
.review-title{font-size:14px;font-weight:700;color:#C0533A;margin-bottom:10px;text-align:center}
.review-item{padding:10px 14px;border-radius:10px;margin-bottom:6px;font-size:13px;line-height:1.6;display:flex;align-items:flex-start;gap:8px}
.review-item.r-correct{background:#E8F5EE;color:#3E8A5E}
.review-item.r-wrong{background:#FFEAE7;color:#B04040}
.review-icon{flex-shrink:0;font-size:15px;margin-top:1px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake 0.35s ease}
@keyframes pop{from{transform:scale(0.96);opacity:0}to{transform:scale(1);opacity:1}}
.card{animation:pop 0.35s ease}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="hero-deco">✝️ ❤️ ✝️</div>
    <h1>십자가에 못 박히심과 죽으심</h1>
    <p class="sub">누가복음 9주차 · 어린이 주일공과 퀴즈</p>
    <div class="verse">"아버지, 저 사람들을 용서하여 주십시오." — 누가복음 23:34</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-text" id="progText">0 / 10</div>
  </div>
  <div id="quiz"></div>
</div>

<script>
const Q=[
  {
    type:"initial",badge:"초성 퀴즈",
    q:"하나님의 관점에서 볼 때, 십자가는 이것이 최고로 나타난 곳이에요.",
    initials:["ㅅ","ㄹ"],answer:"사랑",
    hint:"예수님께서 십자가에서 죽으실 때, 그분의 큰 ○○이 표현되었어요.",
    exp:"십자가는 하나님의 <b>'사랑'</b>이 최고로 나타난 곳이에요. 주 예수님께서 십자가에서 죽으실 때, 그분의 큰 사랑이 표현되었어요."
  },
  {
    type:"ox",badge:"O / X 퀴즈",
    q:"로마 총독 빌라도는 예수님에게서 <span class='hl'>죄를 발견하고</span> 십자가 형벌을 내렸다.",
    answer:false,
    hint:"빌라도는 예수님을 고발했던 사람들에게 '죄목을 찾지 못하였소'라고 여러 번 말했어요.",
    exp:"빌라도는 예수님에게서 아무런 죄목도 찾지 못했어요. <b>세 번</b>이나 '나는 이 사람에게서 아무런 죄목도 찾지 못하였소'라고 말했답니다."
  },
  {
    type:"choice",badge:"객관식",
    q:"<span class='hl'>의롭다</span>는 것은 어떤 의미인가요?",
    opts:["부자이고 유명한 것","하나님과 모든 사람과 모든 것에 대해 올바른 것","힘이 세고 강한 것","공부를 잘하는 것"],answer:1,
    hint:"예수님은 하나님 앞에서, 사람 앞에서 항상 올바르게 말씀하시고 행동하셨어요.",
    exp:"의롭다는 것은 <b>하나님과 모든 사람과 모든 것에 대해 올바른 것</b>을 의미해요. 예수님은 단 한 번도 올바르지 않게 행하신 적이 없으셨어요."
  },
  {
    type:"blank",badge:"빈칸 채우기",
    q:"예수님은 자신을 조롱하고 박해한 사람들을 {0}하시고, 그들을 위해 {1}하셨습니다.",
    blanks:["용서","기도"],
    hint:"예수님은 박해하는 사람들의 잘못을 잊어버리고 놓아주셨고, 하나님께 그들을 위해 말씀드렸어요.",
    exp:"예수님은 박해하는 자들을 <b>용서</b>하시고, 하나님께 그들의 죄를 용서해 달라고 <b>기도</b>하셨어요."
  },
  {
    type:"initial",badge:"초성 퀴즈",
    q:"십자가는 로마에서 흉악한 죄인들에게 이것을 집행하기 위해 사용했어요.",
    initials:["ㅅ","ㅎ"],answer:"사형",
    hint:"당시 가장 심각한 죄를 지은 사람들이 목숨을 잃게 되는 벌이에요.",
    exp:"십자가는 로마에서 흉악한 죄인들을 <b>사형</b>시키기 위해 사용했던 방법이에요. 고통이 어마어마했고, 가장 심각한 벌이었어요."
  },
  {
    type:"ox",badge:"O / X 퀴즈",
    q:"<span class='hl'>용서</span>란 다른 사람의 잘못을 잊어버리고 그 사람을 놓아주는 것이다.",
    answer:true,
    hint:"용서한 후에는 그 사람의 허물을 다시 언급하지 말아야 해요.",
    exp:"맞아요! 용서는 다른 사람의 잘못을 <b>잊어버리고 그 사람을 놓아주는 것</b>이에요. 입으로만이 아니라 마음으로 잊어버려야 해요."
  },
  {
    type:"choice",badge:"객관식",
    q:"예수님이 십자가에 달리셨을 때, 예수님을 조롱하지 <b>않은</b> 사람은 누구인가요?",
    opts:["군인들","대제사장들과 율법학자들","예수님의 제자들","함께 못 박힌 강도들"],answer:2,
    hint:"군인들, 지나가는 사람들, 종교 지도자들, 장로들, 강도들이 모두 조롱했어요. 나머지 한 그룹을 찾아보세요!",
    exp:"군인들, 지나가는 사람들, 대제사장들, 율법학자들, 장로들, 강도들이 모두 예수님을 조롱했어요. <b>제자들</b>은 포함되지 않아요."
  },
  {
    type:"blank",badge:"빈칸 채우기",
    q:'"아버지, 저 사람들을 {0}하여 주십시오. 그들은 자기들이 무슨 일을 하고 있는지 {1} 못합니다."',
    blanks:["용서","알지"],
    hint:"이것은 누가복음 23장 34절의 말씀이에요. 예수님이 십자가 위에서 하신 기도예요.",
    exp:"<b>누가복음 23장 34절</b>의 말씀이에요. 예수님께서 십자가 위에서 자신을 박해하는 사람들을 위해 하나님께 올린 기도랍니다."
  },
  {
    type:"match",badge:"연결하기",
    q:"왼쪽 내용과 알맞은 답을 연결해 보세요.",
    pairs:[
      {left:"빌라도가 죄 없다고 말한 횟수",right:"세 번"},
      {left:"예수님이 형벌을 받으신 이유",right:"사랑"},
      {left:"용서하기 어려울 때의 비결",right:"기도"}
    ],
    hint:"빌라도는 여러 번 반복해서 말했고, 예수님은 마음이 가득했던 것 때문에 형벌을 받으셨어요.",
    exp:"빌라도는 <b>세 번</b> 죄 없다고 말했고, 예수님은 <b>사랑</b> 때문에 형벌을 받으셨어요. 용서가 어려울 때는 <b>기도</b>하면 돼요."
  },
  {
    type:"initial",badge:"초성 퀴즈",
    q:"예수님은 사람을 사랑하셔서 자신의 목숨을 기꺼이 이것 하셨어요.",
    initials:["ㅎ","ㅅ"],answer:"희생",
    hint:"사랑하는 사람을 위해 자신의 것을 내어주는 것을 뜻해요.",
    exp:"예수님은 모든 죄인들에 대한 사랑으로 가득 차 있었고, 모든 사람을 대신하여 기꺼이 자신의 목숨을 <b>희생</b>하셨어요."
  }
];

let cur=0,score=0,answers=[],reviewData=[];

function updateProg(){
  document.getElementById('progFill').style.width=((cur)/Q.length*100)+'%';
  document.getElementById('progText').textContent=(cur)+' / '+Q.length;
}

function render(){
  const w=document.getElementById('quiz');
  if(cur>=Q.length){showResult();return}
  const q=Q[cur];
  updateProg();

  let h='<div class="card type-'+q.type+'">';
  h+='<span class="type-badge">'+q.badge+'</span>';
  h+='<div class="q-text"><span class="q-num-circle">'+(cur+1)+'</span>'+q.q+'</div>';

  // Hint
  h+='<div class="hint-wrap"><button class="hint-btn" id="hintBtn"><span class="icon">🌸</span> 힌트 보기</button>';
  h+='<div class="hint-content" id="hintContent">'+q.hint+'</div></div>';

  if(q.type==='choice'){
    h+='<div class="opts" id="opts">';
    q.opts.forEach((o,i)=>{h+='<button class="opt-btn" data-idx="'+i+'"><span class="num">'+'①②③④'[i]+'</span><span>'+o+'</span></button>'});
    h+='</div>';
  }
  else if(q.type==='ox'){
    h+='<div class="ox-row" id="oxRow">';
    h+='<button class="ox-btn o-btn" data-val="true">⭕</button>';
    h+='<button class="ox-btn x-btn" data-val="false">❌</button></div>';
  }
  else if(q.type==='initial'){
    h+='<div class="initial-display"><div class="initial-letters">';
    q.initials.forEach(l=>{h+='<div class="letter-box">'+l+'</div>'});
    h+='</div></div>';
    h+='<div class="input-row"><input type="text" class="text-input" id="initialInput" placeholder="정답을 입력하세요" autocomplete="off"><button class="submit-btn initial-submit" id="initialSubmit">확인</button></div>';
  }
  else if(q.type==='blank'){
    let parts=q.q.split(/\{(\d+)\}/);
    h+='<div class="blank-sentence">';
    for(let i=0;i<parts.length;i++){if(i%2===0)h+=parts[i];else h+='<span class="blank-slot" id="blank'+parts[i]+'">?</span>'}
    h+='</div>';
    h+='<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">';
    q.blanks.forEach((b,i)=>{
      h+='<div class="input-row"><span style="font-size:13px;color:#C4917E;min-width:22px;font-weight:700">'+(i+1)+'.</span><input type="text" class="text-input blank-input" data-idx="'+i+'" placeholder="'+(i+1)+'번 빈칸의 답" autocomplete="off"></div>';
    });
    h+='<button class="submit-btn blank-submit" id="blankSubmit" style="margin-top:4px">확인</button></div>';
  }
  else if(q.type==='match'){
    const shuffled=[...q.pairs].map(p=>p.right).sort(()=>Math.random()-0.5);
    h+='<div class="match-container" id="matchArea">';
    q.pairs.forEach((p,i)=>{
      h+='<div class="match-item"><div class="match-q">'+p.left+'</div><div class="match-a-slot" id="slot'+i+'" data-idx="'+i+'">선택</div></div>';
    });
    h+='</div><div class="match-bank" id="matchBank">';
    shuffled.forEach(r=>{h+='<button class="match-chip" data-val="'+r+'">'+r+'</button>'});
    h+='</div><button class="match-check-btn" id="matchCheck" disabled>정답 확인</button>';
  }

  h+='<div class="explanation" id="exp">'+q.exp+'</div>';
  h+='<button class="next-btn" id="nextBtn">'+(cur<Q.length-1?'다음 문제 →':'결과 보기 →')+'</button>';
  h+='</div>';
  w.innerHTML=h;

  // Hint toggle
  document.getElementById('hintBtn').addEventListener('click',function(){
    const c=document.getElementById('hintContent');
    c.classList.toggle('show');
    this.innerHTML=c.classList.contains('show')?'<span class="icon">🌸</span> 힌트 닫기':'<span class="icon">🌸</span> 힌트 보기';
  });

  // Type-specific logic
  if(q.type==='choice'){
    document.getElementById('opts').addEventListener('click',function(e){
      const btn=e.target.closest('.opt-btn');if(!btn||btn.classList.contains('locked'))return;
      const idx=parseInt(btn.dataset.idx),btns=document.querySelectorAll('.opt-btn'),ok=idx===q.answer;
      if(ok){score++;btn.classList.add('correct')}else{btn.classList.add('incorrect');btns[q.answer].classList.add('correct')}
      answers.push(ok);reviewData.push({num:cur+1,q:q.q.replace(/<[^>]+>/g,''),ok});
      btns.forEach(b=>b.classList.add('locked'));finish();
    });
  }
  else if(q.type==='ox'){
    document.getElementById('oxRow').addEventListener('click',function(e){
      const btn=e.target.closest('.ox-btn');if(!btn||btn.classList.contains('locked'))return;
      const val=btn.dataset.val==='true',btns=document.querySelectorAll('.ox-btn'),ok=val===q.answer;
      if(ok){score++;btn.classList.add('correct')}else{btn.classList.add('incorrect');btns.forEach(b=>{if((b.dataset.val==='true')===q.answer)b.classList.add('correct')})}
      answers.push(ok);reviewData.push({num:cur+1,q:q.q.replace(/<[^>]+>/g,''),ok});
      btns.forEach(b=>b.classList.add('locked'));finish();
    });
  }
  else if(q.type==='initial'){
    const inp=document.getElementById('initialInput'),sub=document.getElementById('initialSubmit');
    function check(){
      const v=inp.value.trim();if(!v)return;sub.disabled=true;
      const ok=v===q.answer;
      if(ok){score++;inp.classList.add('correct-input')}else{inp.classList.add('incorrect-input');inp.closest('.card').classList.add('shake')}
      answers.push(ok);reviewData.push({num:cur+1,q:q.q.replace(/<[^>]+>/g,''),ok});
      if(!ok){const d=document.createElement('div');d.style.cssText='margin-top:8px;font-size:14px;color:#4A9A6E;font-weight:700';d.textContent='정답: '+q.answer;inp.closest('.input-row').after(d)}
      inp.disabled=true;finish();
    }
    sub.addEventListener('click',check);inp.addEventListener('keydown',function(e){if(e.key==='Enter')check()});inp.focus();
  }
  else if(q.type==='blank'){
    const sub=document.getElementById('blankSubmit');
    function check(){
      const inputs=document.querySelectorAll('.blank-input');let allOk=true;
      inputs.forEach((inp,i)=>{
        const v=inp.value.trim(),ok=v===q.blanks[i];
        const sl=document.getElementById('blank'+i);
        if(ok){inp.classList.add('correct-input');sl.textContent=q.blanks[i];sl.style.color='#4A9A6E'}
        else{inp.classList.add('incorrect-input');sl.textContent=q.blanks[i];sl.style.color='#D4605A';allOk=false}
        inp.disabled=true;
      });
      if(allOk)score++;answers.push(allOk);reviewData.push({num:cur+1,q:q.q.replace(/\{\d+\}/g,'___').replace(/<[^>]+>/g,''),ok:allOk});
      sub.disabled=true;finish();
    }
    sub.addEventListener('click',check);
    document.querySelectorAll('.blank-input').forEach(inp=>{inp.addEventListener('keydown',function(e){if(e.key==='Enter')check()})});
    document.querySelector('.blank-input').focus();
  }
  else if(q.type==='match'){
    let selectedSlot=null;const slots=document.querySelectorAll('.match-a-slot'),chips=document.querySelectorAll('.match-chip'),asgn={};
    slots.forEach(s=>{s.addEventListener('click',function(){
      if(this.classList.contains('locked'))return;
      slots.forEach(x=>x.style.borderColor='');this.style.borderColor='#7A9BD9';selectedSlot=parseInt(this.dataset.idx);
      if(asgn[selectedSlot]!==undefined){const ov=asgn[selectedSlot];chips.forEach(c=>{if(c.dataset.val===ov)c.classList.remove('used')});delete asgn[selectedSlot];this.textContent='선택';this.classList.remove('filled');upd()}
    })});
    chips.forEach(c=>{c.addEventListener('click',function(){
      if(this.classList.contains('used')||this.classList.contains('locked')||selectedSlot===null)return;
      if(asgn[selectedSlot]!==undefined){const ov=asgn[selectedSlot];chips.forEach(x=>{if(x.dataset.val===ov)x.classList.remove('used')})}
      asgn[selectedSlot]=this.dataset.val;this.classList.add('used');
      const sl=document.getElementById('slot'+selectedSlot);sl.textContent=this.dataset.val;sl.classList.add('filled');
      const ne=[...slots].find(s=>!s.classList.contains('filled'));
      if(ne){slots.forEach(x=>x.style.borderColor='');ne.style.borderColor='#7A9BD9';selectedSlot=parseInt(ne.dataset.idx)}else{selectedSlot=null;slots.forEach(x=>x.style.borderColor='')}
      upd();
    })});
    function upd(){document.getElementById('matchCheck').disabled=Object.keys(asgn).length<q.pairs.length}
    document.getElementById('matchCheck').addEventListener('click',function(){
      let allOk=true;
      q.pairs.forEach((p,i)=>{const sl=document.getElementById('slot'+i);if(asgn[i]===p.right){sl.classList.add('correct-slot')}else{sl.classList.add('wrong-slot');sl.textContent=p.right+' ✓';allOk=false}sl.classList.add('locked')});
      chips.forEach(c=>c.classList.add('locked'));if(allOk)score++;
      answers.push(allOk);reviewData.push({num:cur+1,q:'연결하기',ok:allOk});
      this.disabled=true;this.style.display='none';finish();
    });
    if(slots.length){slots[0].style.borderColor='#7A9BD9';selectedSlot=0}
  }

  document.getElementById('nextBtn').addEventListener('click',function(){cur++;render()});
}

function finish(){
  document.getElementById('exp').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('progFill').style.width=((cur+1)/Q.length*100)+'%';
  document.getElementById('progText').textContent=(cur+1)+' / '+Q.length;
}

function showResult(){
  const w=document.getElementById('quiz');
  document.getElementById('progFill').style.width='100%';
  document.getElementById('progText').textContent='완료!';
  let stars='',msg='';
  if(score===10){stars='⭐⭐⭐⭐⭐';msg='완벽해요! 오늘 말씀을 정말 잘 이해했어요! 예수님의 사랑과 용서를 마음에 잘 새겼네요! ❤️'}
  else if(score>=8){stars='⭐⭐⭐⭐';msg='훌륭해요! 거의 다 맞혔어요! 예수님의 사랑을 잘 기억하고 있네요!'}
  else if(score>=6){stars='⭐⭐⭐';msg='잘했어요! 조금만 더 복습하면 완벽할 거예요. 다시 도전해 볼까요?'}
  else{stars='⭐⭐';msg='괜찮아요! 다시 한번 내용을 읽어보고 도전해 봐요. 할 수 있어요!'}
  let h='<div class="result">';
  h+='<div class="result-stars">'+stars+'</div>';
  h+='<div class="result-score">'+score+' / '+Q.length+'</div>';
  h+='<div class="result-label">정답 수</div>';
  h+='<div class="result-detail">';
  h+='<div class="result-stat green"><div class="val">'+score+'</div><div class="lbl">맞힌 문제</div></div>';
  h+='<div class="result-stat red"><div class="val">'+(Q.length-score)+'</div><div class="lbl">틀린 문제</div></div>';
  h+='</div>';
  h+='<div class="result-msg">'+msg+'</div>';

  // Review
  h+='<div class="review-section"><div class="review-title">📋 문제별 결과</div>';
  reviewData.forEach(r=>{
    h+='<div class="review-item '+(r.ok?'r-correct':'r-wrong')+'"><span class="review-icon">'+(r.ok?'✅':'❌')+'</span><span>'+r.num+'번. '+r.q.substring(0,35)+(r.q.length>35?'...':'')+'</span></div>';
  });
  h+='</div>';

  h+='<button class="retry-btn" id="retryBtn">🔄 다시 풀기</button>';
  h+='</div>';
  w.innerHTML=h;
  document.getElementById('retryBtn').addEventListener('click',function(){cur=0;score=0;answers=[];reviewData=[];render()});
}

render();
</script>
</body>
</html>
