<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누가복음 9주 - 십자가에 못 박히심과 죽으심 퀴즈</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: #f7f7f5; color: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
.quiz-wrap { max-width: 580px; width: 100%; }
.header { text-align: center; margin-bottom: 2rem; }
.header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.header p { font-size: 14px; color: #888; }
.progress { display: flex; gap: 4px; margin-bottom: 1.5rem; }
.prog-dot { flex: 1; height: 5px; border-radius: 3px; background: #e0e0dc; transition: background 0.3s; }
.prog-dot.done { background: #1D9E75; }
.prog-dot.wrong { background: #E24B4A; }
.prog-dot.active { background: #aaa; }
.q-num { font-size: 13px; color: #999; margin-bottom: 4px; }
.q-text { font-size: 18px; font-weight: 600; line-height: 1.7; margin-bottom: 1.25rem; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt-btn { text-align: left; padding: 14px 18px; border-radius: 10px; border: 1px solid #e0e0dc; background: #fff; color: #1a1a1a; font-size: 15px; line-height: 1.5; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-family: inherit; }
.opt-btn:hover:not(.locked) { border-color: #bbb; background: #fafafa; }
.opt-btn.correct { border-color: #1D9E75; background: #E1F5EE; color: #085041; }
.opt-btn.incorrect { border-color: #E24B4A; background: #FCEBEB; color: #791F1F; }
.opt-btn.locked { cursor: default; opacity: 0.55; }
.opt-btn.correct.locked { opacity: 1; }
.explanation { margin-top: 1rem; padding: 14px 18px; border-radius: 10px; background: #f0efeb; font-size: 14px; color: #555; line-height: 1.7; display: none; }
.explanation.show { display: block; }
.next-btn { margin-top: 1.25rem; padding: 11px 28px; border-radius: 10px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-size: 14px; font-weight: 500; cursor: pointer; display: none; font-family: inherit; }
.next-btn:hover { background: #f5f5f3; }
.next-btn.show { display: inline-block; }
.result-wrap { text-align: center; padding: 3rem 0; }
.result-score { font-size: 52px; font-weight: 600; }
.result-label { font-size: 15px; color: #999; margin-top: 4px; }
.result-msg { font-size: 17px; margin-top: 1.5rem; line-height: 1.7; }
.retry-btn { margin-top: 1.5rem; padding: 11px 32px; border-radius: 10px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.retry-btn:hover { background: #f5f5f3; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="header">
    <h1>십자가에 못 박히심과 죽으심 (1)</h1>
    <p>누가복음 9주차 퀴즈 · 10문제</p>
  </div>
  <div id="quiz"></div>
</div>
<script>
const questions = [
  {
    q: "'의롭다'는 것은 어떤 의미인가요?",
    opts: ["부자이고 유명한 것", "하나님과 모든 사람과 모든 것에 대해 올바른 것", "힘이 세고 강한 것", "공부를 잘하는 것"],
    ans: 1,
    exp: "의롭다는 것은 하나님과 모든 사람과 모든 것에 대해 올바른 것을 의미해요. 예수님은 항상 올바르게 말씀하시고 행동하셨어요."
  },
  {
    q: "로마 총독 빌라도는 예수님에 대해 뭐라고 말했나요?",
    opts: ["이 사람은 큰 죄인이다", "나는 이 사람에게서 아무런 죄목도 찾지 못하였소", "이 사람을 즉시 풀어주겠소", "이 사람은 왕이 될 자격이 있소"],
    ans: 1,
    exp: "빌라도는 예수님의 잘못을 아무것도 찾아내지 못하고, 세 번이나 '나는 이 사람에게서 아무런 죄목도 찾지 못하였소'라고 말했어요."
  },
  {
    q: "빌라도는 예수님에게 죄가 없다고 몇 번 말했나요?",
    opts: ["한 번", "두 번", "세 번", "네 번"],
    ans: 2,
    exp: "빌라도는 예수님을 고발했던 사람들에게 세 번이나 죄가 없다고 분명히 말했어요."
  },
  {
    q: "십자가는 로마에서 어떤 용도로 사용되었나요?",
    opts: ["왕을 세우기 위한 의식", "흉악한 죄인들을 사형시키기 위한 방법", "군인들의 훈련 도구", "전쟁에서 사용하는 무기"],
    ans: 1,
    exp: "십자가는 로마에서 흉악한 죄인들을 사형시키기 위해 사용했던 방법이에요. 당시 가장 심각한 죄를 지은 사람들이 받은 벌이었어요."
  },
  {
    q: "예수님께서 십자가의 형벌을 받으신 이유는 무엇인가요?",
    opts: ["죄를 지었기 때문에", "사람을 사랑하셔서 기꺼이 희생하신 것", "빌라도의 명령 때문에", "군인들에게 잡혔기 때문에"],
    ans: 1,
    exp: "예수님은 사람을 사랑하셔서 모든 사람을 대신하여 기꺼이 죄의 형벌을 받으셨어요."
  },
  {
    q: "하나님의 관점에서 볼 때, 십자가는 무엇이 최고로 나타난 곳인가요?",
    opts: ["하나님의 능력", "하나님의 심판", "하나님의 사랑", "하나님의 지혜"],
    ans: 2,
    exp: "하나님의 관점에서 볼 때, 십자가는 그분의 '사랑'이 최고로 나타난 곳이에요."
  },
  {
    q: "예수님이 십자가에 달리셨을 때, 예수님을 조롱한 사람들이 아닌 것은?",
    opts: ["군인들", "대제사장들과 율법학자들", "함께 십자가에 못 박힌 강도들", "예수님의 제자들"],
    ans: 3,
    exp: "군인들, 지나가는 사람들, 대제사장들과 율법학자들, 장로들, 함께 십자가에 못 박힌 강도들이 예수님을 조롱했어요. 제자들은 여기에 포함되지 않아요."
  },
  {
    q: "예수님께서 십자가 위에서 하신 기도는 무엇인가요?",
    opts: ["아버지, 저를 구해 주십시오", "아버지, 저 사람들을 용서하여 주십시오", "아버지, 저 사람들을 벌하여 주십시오", "아버지, 저를 이곳에서 내려 주십시오"],
    ans: 1,
    exp: "예수님은 '아버지, 저 사람들을 용서하여 주십시오. 그들은 자기들이 무슨 일을 하고 있는지 알지 못합니다'라고 기도하셨어요. (누가복음 23:34)"
  },
  {
    q: "'용서'란 무엇을 의미하나요?",
    opts: ["다른 사람의 잘못을 크게 꾸짖는 것", "다른 사람의 잘못을 잊어버리고 그 사람을 놓아주는 것", "다른 사람의 잘못을 모든 사람에게 알리는 것", "다른 사람의 잘못을 기억해 두었다가 나중에 이야기하는 것"],
    ans: 1,
    exp: "용서는 다른 사람의 잘못을 잊어버리고 그 사람을 놓아주는 것을 말해요. 용서한 후에는 그 사람의 허물을 다시 언급하지 말아야 해요."
  },
  {
    q: "누군가를 용서하기 어려울 때, 어떻게 하면 좋을까요?",
    opts: ["그 사람을 피해 다닌다", "예수님처럼 그 사람을 위해 주님께 기도한다", "다른 친구에게 그 사람의 잘못을 이야기한다", "그 사람에게 똑같이 되갚아 준다"],
    ans: 1,
    exp: "예수님처럼 그 사람을 위해 주님께 기도하면, 결국 그를 용서할 수 있게 되고, 마음이 주님과 같이 넓어질 거예요."
  }
];

let current = 0, score = 0, answers = [];

function render() {
  const wrap = document.getElementById('quiz');
  if (current >= questions.length) { showResult(); return; }
  const q = questions[current];
  let html = '<div class="progress">';
  for (let i = 0; i < questions.length; i++) {
    let cls = '';
    if (i < answers.length) cls = answers[i] ? 'done' : 'wrong';
    else if (i === current) cls = 'active';
    html += '<div class="prog-dot ' + cls + '"></div>';
  }
  html += '</div>';
  html += '<div class="q-num">' + (current + 1) + ' / ' + questions.length + '</div>';
  html += '<div class="q-text">' + q.q + '</div>';
  html += '<div class="opts" id="opts">';
  for (let i = 0; i < q.opts.length; i++) {
    html += '<button class="opt-btn" data-idx="' + i + '">' + q.opts[i] + '</button>';
  }
  html += '</div>';
  html += '<div class="explanation" id="exp">' + q.exp + '</div>';
  html += '<button class="next-btn" id="nextBtn">' + (current < questions.length - 1 ? '다음 문제' : '결과 보기') + '</button>';
  wrap.innerHTML = html;

  document.getElementById('opts').addEventListener('click', function(e) {
    const btn = e.target.closest('.opt-btn');
    if (!btn || btn.classList.contains('locked')) return;
    const idx = parseInt(btn.dataset.idx);
    const btns = document.querySelectorAll('.opt-btn');
    const isCorrect = idx === q.ans;
    if (isCorrect) { score++; btn.classList.add('correct'); }
    else { btn.classList.add('incorrect'); btns[q.ans].classList.add('correct'); }
    answers.push(isCorrect);
    btns.forEach(function(b) { b.classList.add('locked'); });
    document.getElementById('exp').classList.add('show');
    document.getElementById('nextBtn').classList.add('show');
    var dots = document.querySelectorAll('.prog-dot');
    dots[current].className = 'prog-dot ' + (isCorrect ? 'done' : 'wrong');
  });

  document.getElementById('nextBtn').addEventListener('click', function() {
    current++;
    render();
  });
}

function showResult() {
  const wrap = document.getElementById('quiz');
  let msg = '';
  if (score === 10) msg = '완벽해요! 오늘 배운 내용을 정말 잘 이해했어요! 🎉';
  else if (score >= 8) msg = '훌륭해요! 거의 다 맞혔어요!';
  else if (score >= 6) msg = '잘했어요! 조금만 더 복습하면 완벽할 거예요.';
  else msg = '괜찮아요! 다시 한번 내용을 읽어보고 도전해 보세요.';
  let html = '<div class="progress">';
  for (let i = 0; i < answers.length; i++) {
    html += '<div class="prog-dot ' + (answers[i] ? 'done' : 'wrong') + '"></div>';
  }
  html += '</div>';
  html += '<div class="result-wrap">';
  html += '<div class="result-score">' + score + ' / ' + questions.length + '</div>';
  html += '<div class="result-label">정답 수</div>';
  html += '<div class="result-msg">' + msg + '</div>';
  html += '<button class="retry-btn" id="retryBtn">다시 풀기</button>';
  html += '</div>';
  wrap.innerHTML = html;
  document.getElementById('retryBtn').addEventListener('click', function() {
    current = 0; score = 0; answers = [];
    render();
  });
}

render();
</script>
</body>
</html>
